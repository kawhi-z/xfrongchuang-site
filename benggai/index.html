<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>本该有的一生</title>
<meta name="description" content="你和一个同年出生在战争中的人，互换了人生。基于真实统计的人生模拟。">
<style>:root {
  --bg: #14110f; --bg2: #1d1916; --card: #221d19; --line: #3a322b;
  --ink: #ece4d8; --muted: #9b8f80; --dim: #6c6156;
  --accent: #d9a35b; --war: #9c4a35; --near: #8a6a3a; --abroad: #5f7385; --life: #d6c7ae;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  --sans: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); height: 100%; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, textarea { font: inherit; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; outline: none; }
input:focus, textarea:focus { border-color: var(--accent); }
.hidden { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 13px; } .fine { color: var(--dim); font-size: 12px; line-height: 1.7; margin-top: 18px; }
.primary { background: var(--accent); color: #1a140e; font-weight: 600; padding: 12px 22px; border-radius: 999px; }
.primary:active { transform: scale(.98); }
.ghost { border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; color: var(--ink); }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 6px 8px; font-size: 13px; }
.wide { width: 100%; margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }

#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
.screen { display: none; height: 100%; }
.screen.on { display: flex; flex-direction: column; }

/* 开场 */
#intro { justify-content: center; padding: 0 24px; position: relative; }
.intro-cv { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 42vh; opacity: 0; animation: fadeIn 2.4s ease forwards; pointer-events: none; }
.intro-inner { position: relative; padding-top: 30vh; }
.intro-inner { text-align: center; }
#intro h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: .2em; margin-bottom: 34px; }
#intro p { font-family: var(--serif); font-size: 17px; line-height: 1.9; margin-bottom: 18px; }
.birth-input { display: flex; gap: 10px; margin: 6px auto 8px; max-width: 320px; }
.birth-input input { text-align: center; font-size: 18px; }
#intro nav { margin-top: 26px; display: flex; justify-content: center; gap: 12px; }
.fade { opacity: 0; animation: fadeIn 1.2s ease forwards; animation-delay: var(--d, 0s); }
@keyframes fadeIn { to { opacity: 1; } }

/* 出生卡 */
#birth { justify-content: center; padding: 0 20px; }
.card-cv { display: block; width: calc(100% + 40px); height: 190px; margin: -22px -20px 14px; border-radius: 16px 16px 0 0; }
.birth-card h2 { font-family: var(--serif); font-size: 28px; margin: 6px 0 10px; }
.birth-card > div { margin: 6px 0; line-height: 1.6; }

/* 属性条 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { font-size: 11px; color: var(--muted); }
.stat .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--life); transition: width .6s ease; }
.stat.flash-up .bar i { background: #9fc28a; } .stat.flash-down .bar i { background: #d0705a; }
.stats.big { margin: 16px 0 4px; } .stats.big .stat { font-size: 12px; }

/* 人生 */
#life { position: relative; }
#stage { position: relative; height: 34vh; min-height: 210px; max-height: 300px; flex: none; overflow: hidden; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 1s ease, transform 2.4s ease; }
#stage canvas.off { opacity: 0; }
#stage.zoom canvas { transform: scale(1.07); }
#stage .hud-top { position: absolute; left: 14px; right: 14px; top: 10px; display: flex; justify-content: space-between; font-family: var(--serif); font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
#hudAge { color: #d8ccbb; }
#caption { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-family: var(--serif); font-size: 22px; letter-spacing: .12em; color: #fff3e0; text-shadow: 0 2px 14px rgba(0,0,0,.9); opacity: 0; transition: opacity .8s ease; pointer-events: none; padding: 0 20px; }
#caption.on { opacity: 1; }
#flash { position: absolute; inset: 0; background: #ffd9a8; opacity: 0; pointer-events: none; }
#flash.on { animation: flashA 1.2s ease-out; }
@keyframes flashA { 0% { opacity: .75; } 100% { opacity: 0; } }
#hud { padding: 6px 16px 10px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
#famBar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 22px; }
.fam { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.fam.away { border-style: dashed; color: var(--muted); }
.fam.gone { border-style: dashed; border-color: #2c2620; color: transparent; min-width: 40px; position: relative; }
.fam.gone::after { content: ''; position: absolute; left: 8px; right: 8px; top: 50%; border-top: 1px solid #3b332c; }
#feed { flex: 1; overflow-y: auto; padding: 14px 16px 30px; -webkit-overflow-scrolling: touch; }
.row { display: flex; gap: 12px; padding: 7px 0; font-family: var(--serif); font-size: 16px; line-height: 1.75; opacity: 0; animation: rowIn .6s ease forwards; }
.row .y { color: var(--dim); font-family: var(--sans); font-size: 12px; min-width: 56px; padding-top: 4px; font-variant-numeric: tabular-nums; }
.row.big .t { color: #fff3e0; } .row.war .y { color: var(--war); }
.row.future .t { color: var(--muted); font-style: italic; }
.row.death .t { color: #fff; font-weight: 600; }
.row.choice .t { color: var(--accent); }
.row.note .t { color: var(--muted); font-size: 14px; }
.today { text-align: center; color: var(--dim); font-size: 12px; margin: 10px 0; letter-spacing: .3em; }
.today::before, .today::after { content: '—'; margin: 0 8px; }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#ctrl { border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); }
#grid { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 8px; min-height: 8px; }
.sq { width: 6px; height: 6px; border-radius: 1px; background: var(--life); }
.sq.war { background: var(--war); } .sq.near { background: var(--near); } .sq.abroad { background: var(--abroad); }
.sq.lost { background: none; outline: 1px solid #5a4e43; outline-offset: -1px; }
.ctrl-row { display: flex; gap: 10px; align-items: center; }
.ctrl-row .ghost { padding: 6px 14px; font-size: 13px; }
#pocketView { margin-left: auto; text-align: right; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* 底部面板 */
.sheet { position: fixed; inset: 0; background: rgba(10, 8, 6, .72); display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: fadeIn .25s ease forwards; opacity: 0; }
.sheet-inner { width: 100%; max-width: 560px; background: var(--bg2); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 86vh; overflow-y: auto; animation: up .3s ease; }
@keyframes up { from { transform: translateY(30px); } to { transform: none; } }
.sheet h3 { font-family: var(--serif); font-size: 19px; line-height: 1.7; font-weight: 600; margin-bottom: 14px; }
.sheet .kicker { color: var(--muted); font-size: 12px; letter-spacing: .15em; margin-bottom: 8px; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; margin-top: 10px; font-family: var(--serif); font-size: 16px; background: var(--card); }
.opt:active { border-color: var(--accent); }
.opt .h { display: block; font-family: var(--sans); font-size: 12px; color: var(--muted); margin-top: 4px; }
.recap p { font-family: var(--serif); line-height: 1.85; margin-bottom: 10px; }
.recap .alt { border-left: 2px solid var(--line); padding-left: 12px; margin: 10px 0; color: #cfc4b4; }
.recap .alt b { color: var(--accent); font-weight: 500; }

/* 结局 */
#end { overflow-y: auto; padding: 24px 18px 40px; }
.end-inner { width: 100%; }
#endAsk { font-family: var(--serif); font-size: 18px; margin-bottom: 12px; }
#endCard .card-cv { height: 210px; }
#endCard h2 { font-family: var(--serif); font-size: 13px; letter-spacing: .3em; color: var(--muted); font-weight: 400; }
#endCard .nm { font-family: var(--serif); font-size: 26px; margin: 8px 0 2px; }
#endCard .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
#endCard p { font-family: var(--serif); font-size: 16px; line-height: 1.85; margin: 6px 0; }
#endCard .peace { color: var(--accent); }
#endCard .hard { color: #e9d2b0; }
#endCard .words { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; color: #fff; }
#endCard .num { color: var(--muted); font-size: 13px; margin-top: 14px; }
#endCard .g { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0; }
#endBtns { margin-top: 14px; }
.row-links { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }

/* 浮层 */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; }
.overlay-inner { max-width: 560px; margin: 0 auto; padding: 20px 20px 60px; }
.overlay .close { float: right; }
.overlay h2 { font-family: var(--serif); font-size: 22px; margin: 18px 0 12px; }
.overlay h3 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
.overlay p, .overlay li { font-size: 14px; line-height: 1.8; color: #d8cebf; }
.overlay ul { padding-left: 18px; }
.mem { border-bottom: 1px solid var(--line); padding: 12px 0; }
.mem .who { font-family: var(--serif); font-size: 16px; }
.mem .w { color: var(--muted); font-size: 13px; margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #2b241e; border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 30; }
@media (min-width: 600px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* 章节 */
.chap { padding: 6px 0 18px; transition: opacity .6s ease; }
.chap.past { opacity: .38; }
.chead { font-size: 12px; letter-spacing: .14em; color: var(--accent); margin: 10px 0 10px; display: flex; justify-content: space-between; }
.chead span { color: var(--dim); letter-spacing: 0; }
.chap .line { font-family: var(--serif); font-size: 17px; line-height: 1.9; margin: 2px 0 6px; opacity: 0; animation: rowIn .7s ease forwards; }
.chap .line.muted { color: var(--muted); font-size: 15px; }
.chap .line.result { color: var(--accent); }
.chap .line.alt { border-left: 2px solid var(--line); padding-left: 12px; color: #cfc4b4; font-size: 16px; }
.chap .line.alt b { color: var(--accent); font-weight: 500; }
.chap.recap .chead { color: var(--muted); }
.bridge { font-size: 13px; color: var(--dim); margin: 14px 0 4px; padding-left: 10px; border-left: 1px dashed var(--line); line-height: 1.6; }
.bridge span { display: block; font-size: 11px; color: #5a4f45; }
.opts { opacity: 0; animation: rowIn .6s ease forwards; margin-top: 6px; }
.opt.picked { border-color: var(--accent); }
.opt.dim { opacity: .35; }
.opt:disabled { cursor: default; }
.letter { font-family: var(--serif); background: #e9dfcd; color: #2a2119; border-radius: 4px; padding: 18px 18px 14px; margin: 12px 0; line-height: 1.9; opacity: 0; animation: rowIn 1s ease forwards; box-shadow: 0 6px 24px rgba(0,0,0,.4); transform: rotate(-0.6deg); }
.letter p { margin: 0 0 6px; } .letter .from { text-align: right; margin-top: 8px; }
.next { width: 100%; }
.ctrl-row #pocketView { display: none; }
.fam.friend { border-color: #4b4036; }
#endCard .trio { color: #d8ccbb; }
</style>
</head>
<body>
<main id="app">

  <section id="intro" class="screen on">
    <canvas id="introCv" class="intro-cv"></canvas>
    <div class="intro-inner">
      <h1>本该有的一生</h1>
      <p class="fade" style="--d:0.2s">此刻，全球约每 6 个孩子里，<br>就有 1 个生活在冲突地区。</p>
      <p class="fade" style="--d:1.4s">你是哪一年出生的？</p>
      <div class="fade birth-input" style="--d:2.2s">
        <input id="byInput" type="number" inputmode="numeric" min="1950" max="2025" placeholder="例如 1995">
        <button id="btnBorn" class="primary">出生</button>
      </div>
      <button id="btnSkip" class="link fade" style="--d:2.6s">跳过，随机一个年份</button>
      <p class="fine fade" style="--d:3s">你会和一个同年出生的人互换人生。<br>他的国家，在他这一生中的某个时候，发生了战争。</p>
      <nav class="fade" style="--d:3.2s"><button class="link" data-open="about">数据说明</button><button class="link" data-open="memorial">纪念馆</button></nav>
    </div>
  </section>

  <section id="birth" class="screen">
    <div class="card birth-card">
      <canvas id="birthCv" class="card-cv"></canvas>
      <div class="muted small" id="bcYear"></div>
      <h2 id="bcName"></h2>
      <div id="bcPlace"></div>
      <div class="muted" id="bcHome"></div>
      <div class="muted" id="bcFam"></div>
      <div id="bcStats" class="stats big"></div>
      <p class="fine">本人物由统计数据生成，不是真实个人。</p>
      <button id="btnStart" class="primary wide">开始这一生</button>
    </div>
  </section>

  <section id="life" class="screen">
    <div id="stage">
      <canvas id="cvA"></canvas><canvas id="cvB"></canvas>
      <div class="hud-top"><span id="hudYear"></span><span id="hudAge"></span></div>
      <div id="caption"></div>
      <div id="flash"></div>
    </div>
    <header id="hud">
      <div id="famBar"></div>
      <div id="statBar" class="stats"></div>
    </header>
    <div id="feed"></div>
    <footer id="ctrl">
      <div id="grid"></div>
      <div class="ctrl-row">
        <button id="btnNext" class="primary next hidden">继续</button>
        <span id="pocketView" class="muted small"></span>
      </div>
    </footer>
  </section>

  <section id="end" class="screen">
    <div class="end-inner">
      <div id="endWords" class="card">
        <p id="endAsk"></p>
        <textarea id="endInput" rows="2" maxlength="60" placeholder="写一句话（可以不写）"></textarea>
        <button id="btnWords" class="primary wide">留下</button>
      </div>
      <div id="endCard" class="card hidden"></div>
      <div id="endBtns" class="hidden">
        <button id="btnSave" class="primary wide">保存分享卡</button>
        <button id="btnCandle" class="ghost wide">点一支蜡烛</button>
        <button id="btnCopy" class="ghost wide">复制这个人的链接</button>
        <button id="btnAgain" class="ghost wide">再出生一次</button>
        <div class="row-links"><button class="link" data-open="memorial">纪念馆</button><button class="link" data-open="about">数据说明</button></div>
      </div>
    </div>
  </section>

  <div id="sheet" class="sheet hidden"><div class="sheet-inner" id="sheetInner"></div></div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-inner">
      <button class="link close" id="btnClose">关闭</button>
      <div id="overlayBody"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  }
  function prompts(st) {
    const out = [];
    if (!st.alive) return out;
    const a = st.age, x = ctxOf(st, st.year);
    if (CARE_AGES.indexOf(a) >= 0) out.push({ kind: 'care', options: careOptions(st) });
    const item = itemThisYear(st);
    if (item) out.push({ kind: 'pocket', item, full: st.pocket.length >= 5 });
    if (ASK_AGES.indexOf(a) >= 0) out.push({ kind: 'ask', age: a });
    if (st.suppress || st.line === 'peace' || st.prison >= st.year) return out;
    const s = scenarioThisYear(st, x);
    if (s) out.push(s);
    return out;
  }
  function scenarioThisYear(st, x) {
    const rest = SC_REST.slice().sort((p, q) => rnd(st.seed, 'ord', p, st.year) - rnd(st.seed, 'ord', q, st.year));
    const list = SC_FIRST.concat(rest);
    for (const id of list) {
      const sc = SC[id];
      if (st.done[id]) continue;
      if (!sc.always && st.big >= MAX_BIG) continue;
      // 战争刚来的那一年，先讲「战争来了」，战时的选择从下一年开始
      if (x.war && !st.everWar && PEACE_SC.indexOf(id) < 0) continue;
      if (!sc.when(st, x)) continue;
      if (id === 'draft') {
        const t = draftTarget(st);
        if (!t) { if (st.age >= 70 || st.loc === 'abroad') { st.done.draft = true; st.log.push({ y: st.year, t: 'draftNone' }); } continue; }
        if (t.role === 'child') {
          if (!st.done.draftChild) { st.done.draftChild = true; SC.draft.apply(st, 'letGo', x); }
          continue;
        }
      }
      const opts = sc.opts(st);
      if (!opts || opts.length < 2) continue;
      const t = id === 'draft' ? draftTarget(st) : null;
      const extra = t ? { role: t.role, who: t.who }
        : id === 'sick' ? { who: sickPatient(st).id } : id === 'sendKid' ? { who: teenKid(st).id }
        : id === 'earlyMarry' ? { who: teenDaughter(st).id } : id === 'house' ? { destroyed: st.house.destroyed } : {};
      const hints = {};
      opts.forEach(o => { hints[o] = {}; const f = sc.fx[o] || {}; for (const k in f) if (f[k]) hints[o][k] = ARROW(f[k]); });
      return Object.assign({ kind: 'choice', id, options: opts, hints, recap: sc.recap }, extra);
    }
    return null;
  }

  function applyChoice(st, c, opt) {
    const sc = SC[c.id], x = ctxOf(st, st.year);
    st.done[c.id] = true;
    if (!sc.always) st.big++;
    st.chosen.push({ id: c.id, opt, year: st.year, age: st.age, who: c.who || null, role: c.role || null, options: c.options });
    bump(st, sc.fx[opt] || {});
    sc.apply(st, opt, x);
  }

  function careOptions(st) {
    const a = st.age, pool = [];
    st.fam.filter(p => p.alive && !p.unborn).forEach(p => {
      if (p.rel === 'gma' && a >= 30) return;
      pool.push('fam:' + p.id);
    });
    const hob = a < 7 ? ['toy', 'animal', 'river'] :
      a < 18 ? ['football', 'drawing', 'radio', 'books', 'friend', 'animal', 'music', 'school'] :
      a < 30 ? ['love', 'football', 'work', 'friend', 'music', 'books', 'home'] :
      a < 55 ? ['work', 'home', 'friend', 'garden', 'music'] : ['garden', 'home', 'friend'];
    hob.forEach(h => pool.push(h));
    if (st.loc !== 'home') pool.push('homeland');
    if (st.army && !st.army.done) pool.push('comrade');
    const out = [];
    for (let i = 0; out.length < 3 && i < 40; i++) {
      const o = pick(pool, rnd(st.seed, 'care', a, i));
      if (out.indexOf(o) < 0) out.push(o);
    }
    return out;
  }
  function applyCare(st, tag) {
    st.care[tag] = (st.care[tag] || 0) + 1;
    st.carePicks.push({ age: st.age, tag });
  }
  function itemThisYear(st) {
    const a = st.age;
    const sis = st.fam.find(p => p.id === 'sis');
    if (sis && sis.alive && st.year - sis.by === 5) return 'drawing:sis';
    if (a === 10 && st.friend && st.friend.alive && !st.friend.abroad) { st.friend.loc = st.loc === 'moved' ? 'home' : st.loc; st.friend.met = st.year; return 'football'; }
    if (a === 12) return 'photo';
    if (st.justMarried) return 'ring';
    const k = st.fam.find(p => p.rel === 'kid' && p.alive && st.year - p.by === 6);
    if (k) return 'tooth:' + k.id;
    return null;
  }
  // 爸爸走了（参军或去世）时，收音机自动到你手里
  function giveRadio(st) {
    if (st.gotRadio || st.line === 'peace') return;
    st.gotRadio = st.year;
    if (st.pocket.length < 5) st.pocket.push('radio');
    else st.pocket[st.pocket.length - 1] = 'radio';
  }
  // drop：口袋满时要放下的那一格；-1 表示放下新东西
  function addItem(st, item, drop) {
    if (drop === -1) return;
    if (drop != null && drop >= 0) st.pocket.splice(drop, 1);
    if (st.pocket.length < 5) st.pocket.push(item);
  }
  function keepOnly(st, i) {
    const kept = st.pocket[i];
    st.lostItems = (st.lostItems || []).concat(st.pocket.filter((_, j) => j !== i));
    st.pocket = kept ? [kept] : [];
    st.took = kept || null;
    st.needTakeOne = false;
  }

  // ---------------- 一年的结算 ----------------
  function kill(st, p, cause) {
    if (!p.alive) return;
    if (p === st) {
      st.alive = false; st.deathYear = st.year; st.cause = cause;
      st.log.push({ y: st.year, t: 'death', cause, army: inArmy(st, st.year) });
    } else {
      p.alive = false; p.diedYear = st.year; p.cause = cause;
      st.log.push({ y: st.year, t: 'famDeath', who: p.id, cause, away: p.away });
      if (p.id === 'dad') giveRadio(st);
      bump(st, EVFX.famDeath);
    }
  }
  function ev(st, e) { st.log.push(e); if (EVFX[e.t]) bump(st, EVFX[e.t]); }

  function finishYear(st) {
    const y = st.year, c = st.c, seed = st.seed, peaceLine = st.line === 'peace';
    const x = ctxOf(st, y), r = x.r, war = x.war;
    st.justMarried = false; st.hungryLast = false;

    // 战争背景
    if (war) {
      if (!st.everWar) ev(st, { y, t: 'warStart', zone: x.zone, intense: r >= INTENSE, away: !homeLoc(st) });
      else if (!isWar(st, y - 1)) ev(st, { y, t: 'warAgain', zone: x.zone, away: !homeLoc(st) });
      else {
        const z0 = zoneOf(st, y - 1);
        if (z0 && z0 !== x.zone && homeLoc(st)) st.log.push({ y, t: 'zoneShift', from: z0, to: x.zone });
      }
      st.everWar = true; st.warYears++; st.lastWarYear = y;
      if (st.firstWar == null) st.firstWar = y;
      if (x.zone === 'in' && homeLoc(st)) st.inZoneYears++;
      if ((homeLoc(st) || st.loc === 'city') && rnd(seed, 'daily', y) < 0.55)
        st.log.push({ y, t: 'warDaily', zone: st.loc === 'city' ? 'city' : x.zone, k: Math.floor(rnd(seed, 'dk', y) * 1000) });
    } else if (!peaceLine && st.everWar && st.lastWarYear === y - 1) {
      ev(st, { y, t: 'warEnd', away: !homeLoc(st) });
      if (st.profiteer && st.stats.money >= 55) st.log.push({ y, t: 'richLonely' });
      if (st.bought) { bump(st, { money: 30 }); st.log.push({ y, t: 'houseValue' }); }
    }

    // 弟弟妹妹出生
    st.fam.forEach(p => {
      if (p.unborn && p.by === y) {
        const mom = st.fam.find(q => q.id === 'mom');
        p.unborn = false;
        if (mom.alive) { p.alive = true; p.loc = mom.loc; ev(st, { y, t: 'sibBorn', who: p.id }); }
      }
    });

    // 家园被打到（只在战区内、住在家里或附近）
    if (!peaceLine && war && x.zone === 'in' && homeLoc(st) && st.house.hits < 2 && st.alive
        && rnd(seed, 'house', y) < Math.min(0.35, r * 90)) {
      st.house.hits++;
      const destroyed = rnd(seed, 'houseD', y) < 0.4;
      if (destroyed) st.house.destroyed = true; else st.house.damaged = true;
      ev(st, { y, t: 'house', destroyed });
      household(st).forEach(p => {
        const id = p === st ? 'self' : p.id;
        const u = rnd(seed, 'hhit', id, y);
        if (u < 0.05) kill(st, p, 'violence');
        else if (u < 0.2) {
          if (p === st) { st.injured++; ev(st, { y, t: 'injury', who: 'self', from: 'house' }); }
          else { p.injured = 1; st.log.push({ y, t: 'injury', who: p.id, from: 'house' }); }
        }
      });
      if (st.alive) { st.house.pending = y; delete st.done.house; }
    }

    // 上学
    const a = st.age;
    if (a >= 6 && st.school.years < st.eduTarget && st.alive && !(st.army && !st.army.done)) {
      let go = true;
      const ez = effZone(st, st, y);
      if (war && (ez === 'in' || ez === 'near')) {
        const closed = rnd(seed, 'closure', y) < closureP(x);
        if (st.school.mode === 'help') go = false;
        else if (closed) go = st.school.mode === 'far' ? rnd(seed, 'farok', y) < 0.75 : false;
      } else if (!peaceLine && st.loc === 'abroad') {
        go = rnd(seed, 'refschool', y) < 0.5;
      }
      if (st.stats.money < 15 && a >= 12 && rnd(seed, 'poorSchool', y) < 0.3) go = false;
      if (!go) { ev(st, { y, t: 'schoolLost', abroad: st.loc === 'abroad' }); st.school.lost++; }
      else {
        st.school.years++;
        const n = st.school.years;
        if (n === 1) st.log.push({ y, t: 'schoolStart' });
        if (n === 6 || n === 9 || n === 12 || n === 16) ev(st, { y, t: 'grad', n });
      }
      if (st.school.lost >= 3 && st.eduTarget > st.school.years && rnd(seed, 'drop', y) < 0.35) {
        st.eduTarget = st.school.years; st.log.push({ y, t: 'dropout' });
      }
    }
    // 挨饿
    if (!peaceLine) {
      const ez = effZone(st, st, y);
      let hp = war ? (ez === 'in' ? Math.min(0.6, 0.1 + r * 300) : ez === 'near' ? 0.15 : ez === 'abroad' ? 0.3 : 0.03) : (st.loc === 'abroad' ? 0.1 : 0);
      if (st.loc === 'abroad2') hp = 0.04;
      hp *= 1.6 - st.stats.money / 100;
      if (hp > 0 && rnd(seed, 'hunger', y) < hp) { st.hunger++; st.hungryLast = true; ev(st, { y, t: 'hunger' }); }
    }
    // 工作
    if (!st.occ && a >= 15 && st.school.years >= st.eduTarget && a >= Math.min(22, st.school.years + 7) && !(st.army && !st.army.done)) {
      st.occ = occupation(st);
      ev(st, { y, t: 'work', occ: st.occ });
    }
    // 结婚
    if (!st.married && a >= (st.sex === 'f' ? 17 : 20) && a <= 45 && !inArmy(st, y)) {
      let p = (st.sex === 'f' ? 0.16 : 0.13) * (0.5 + st.stats.social / 100);
      if (war) p *= 0.6;
      if (!peaceLine && st.loc === 'abroad') p *= 0.8;
      if (rnd(seed, 'marry', y) < p) {
        st.married = true; st.justMarried = true;
        st.fam.push({ id: 'sp', rel: 'sp', sex: st.sex === 'f' ? 'm' : 'f',
          by: st.by + (st.sex === 'f' ? 2 : -2) + Math.floor(rnd(seed, 'spage') * 4), alive: true, loc: st.loc, away: null });
        ev(st, { y, t: 'marry' });
      }
    }
    // 孩子
    const sp = st.fam.find(p => p.id === 'sp');
    if (st.married && sp && sp.alive && !sp.away && a >= 18 && a <= 44 && !inArmy(st, y)) {
      let p = (peaceLine ? peace : actual)(c, 'tfr', y) / 22;
      if (war) p *= 0.8;
      const nk = st.fam.filter(q => q.rel === 'kid').length;
      if (nk < 7 && rnd(seed, 'kid', y) < p) {
        st.fam.push({ id: 'k' + nk, rel: 'kid', sex: rnd(seed, 'kidsex', nk) < 0.5 ? 'f' : 'm', by: y, alive: true, loc: st.loc, away: null });
        ev(st, { y, t: 'kid', who: 'k' + nk });
      }
    }

    // 军队：自己
    if (st.army && !st.army.done && st.alive) {
      const A = st.army;
      if (y === A.start) st.log.push({ y, t: 'training' });
      if (A.post === 'front' && !(A.powUntil >= y) && rnd(seed, 'pow', y) < 0.03) {
        A.powUntil = y + 1 + Math.floor(rnd(seed, 'powlen', y) * 3); ev(st, { y, t: 'pow' });
      }
      if (A.powUntil === y) st.log.push({ y, t: 'powBack' });
      if (A.comrade && !A.withFriend && !A.comradeDied && y > A.start) {
        const cr = Math.min(RISK_CAP, r * 6 * POST_K[A.post || 'rear']);
        if (rnd(seed, 'comrade', y) < cr) { A.comradeDied = y; ev(st, { y, t: 'comradeDeath' }); }
      }
      if (y > A.start && rnd(seed, 'letterHome', y) < 0.35) st.log.push({ y, t: 'letterHome' });
      if (y >= A.until || (!war && !isWar(st, y - 1))) {
        A.done = true;
        st.trauma = rnd(seed, 'trauma') < (A.post === 'front' ? 0.6 : 0.3);
        st.log.push({ y, t: 'demob', trauma: st.trauma });
      }
    }
    // 躲征兵
    if (st.hiding >= y && !st.army && war && homeLoc(st) && rnd(seed, 'search', y) < 0.15) {
      ev(st, { y, t: 'caught' }); startArmy(st, st, y); st.hiding = 0;
    }
    // 帮人藏
    if (st.hidingNb >= y && war && rnd(seed, 'nbsearch', y) < 0.15) {
      const hh = household(st);
      const vict = rnd(seed, 'nbv', y) < 0.5 ? st : hh[1] || st;
      st.log.push({ y, t: 'nbSearch' });
      if (rnd(seed, 'nbk', y) < 0.35) kill(st, vict, 'violence');
      else if (vict === st) { st.injured++; ev(st, { y, t: 'injury', who: 'self' }); }
      st.hidingNb = 0;
    }
    if (st.nbRefused && st.nbRefused === y - 2) st.log.push({ y, t: 'nbGone' });
    // 战争财：运货被抓
    if (st.running >= y && rnd(seed, 'runCaught', y) < 0.12) {
      st.prison = y + 2; st.running = 0; bump(st, EVFX.prison); st.log.push({ y, t: 'prison', why: 'smuggle' });
    }
    if (st.grainThreat === y) { st.injured++; ev(st, { y, t: 'injury', who: 'self', from: 'threat' }); }
    if (st.prison && st.prison === y) st.log.push({ y, t: 'prisonOut' });
    // 家人：被搜到、参军来信、回来
    st.fam.forEach(p => {
      if (!p.alive) return;
      if (p.hiding >= y && war && p.loc === 'home' && rnd(seed, 'search', p.id, y) < 0.15) { p.hiding = 0; st.log.push({ y, t: 'famCaught', who: p.id }); startArmy(st, p, y); }
      if (p.army && !p.army.done) {
        if (y > p.army.start && rnd(seed, 'letter', p.id, y) < 0.4) st.log.push({ y, t: 'letter', who: p.id });
        if (y >= p.army.until || (!war && !isWar(st, y - 1))) {
          p.army.done = true; p.away = null; p.loc = st.loc === 'abroad2' ? 'home' : st.loc;
          ev(st, { y, t: 'famBack', who: p.id });
        }
      }
    });

    // 妹妹
    const sis = sisOf(st);
    if (sis && sis.alive && !peaceLine) {
      const sa = y - sis.by;
      if (sis.away === 'school' && sa >= 18) { sis.away = null; sis.loc = st.loc === 'abroad2' ? 'home' : st.loc; sis.educated = true; st.log.push({ y, t: 'sisBack' }); }
      if (war && !sis.away && sis.loc === st.loc && sa >= 16 && sa <= 17 && st.stats.money < 25 && rnd(seed, 'sismar', y) < 0.25) {
        sis.away = 'married'; st.log.push({ y, t: 'sisMarried' });
      }
      if (war && !sis.nurse && sis.away !== 'married' && sis.away !== 'abroad' && sa >= 16 && sa <= 25 && !sis.schoolLost
          && (x.zone === 'in' || x.zone === 'near') && rnd(seed, 'sisnurse', y) < 0.5) {
        sis.nurse = y; st.log.push({ y, t: 'sisNurse' });
      }
    }
    // 朋友
    const f = st.friend;
    if (f && f.alive && !peaceLine) {
      const fa = y - f.by;
      if (f.met && war && !f.army && !f.abroad && f.sex === 'm' && fa >= 16 && fa <= 40 && rnd(seed, 'fdraft', y) < 0.3) {
        f.army = { start: y, until: y + 2 + Math.floor(rnd(seed, 'fdur') * 4), post: rnd(seed, 'fpost') < 0.6 ? 'front' : 'rear', done: false };
        st.log.push({ y, t: 'friendDrafted' });
        if (inArmy(st, y)) st.army.withFriend = true;
      } else if (f.met && y - f.met >= 3 && war && !f.army && !f.abroad && rnd(seed, 'fabroad', y) < 0.03) {
        f.abroad = y; f.loc = 'abroad'; st.log.push({ y, t: 'friendLeft' });
      }
      if (f.army && !f.army.done && (y >= f.army.until || (!war && !isWar(st, y - 1)))) { f.army.done = true; st.log.push({ y, t: 'friendBack' }); }
      const v = violentRisk(st, f, y), hb = Math.max(0, hazard(fa, f.sex, c, y, 'war') - r);
      const u = rnd(seed, 'death', 'friend', y);
      if (u < v + hb) {
        f.alive = false; f.diedYear = y; f.cause = u < v ? 'violence' : fa < 5 ? 'child' : fa >= 65 ? 'old' : 'illness';
        st.log.push({ y, t: 'friendDeath', cause: f.cause, army: inArmy(f, y) });
        if (st.army && !st.army.done && st.army.withFriend && !st.army.comradeDied) st.army.comradeDied = y;
      }
    }

    // 生死
    const hf = clamp(1 + (60 - st.stats.health) / 100, 0.7, 1.5);
    st.fam.filter(p => p.alive).concat([st]).forEach(p => {
      const id = p === st ? 'self' : p.id;
      const age = y - p.by;
      if (age < 0 || !p.alive) return;
      if (p.id === 'mom' && st.fam.some(q => q.id === 'sis' && q.unborn)) return;
      const hp = hazard(age, p.sex, c, y, 'peace');
      let hb = hp;
      if (!peaceLine) {
        hb = Math.max(hp, hazard(age, p.sex, c, y, 'war') - r);
        if (p.loc === 'abroad' && age < 5) hb *= 1.15;
        if (st.sick && st.sick.y === y && st.sick.who === id) hb = Math.max(hb, st.sick.opt === 'toCity' ? 0.2 : 0.5);
      }
      if (p === st) hb *= hf;
      const v = peaceLine ? 0 : violentRisk(st, p, y);
      const u = rnd(seed, 'death', id, y);
      if (u < v) { kill(st, p, 'violence'); return; }
      if (u < v + hb) { kill(st, p, age < 5 ? 'child' : age >= 65 ? 'old' : 'illness'); return; }
      if (v > 0 && rnd(seed, 'injury', id, y) < Math.min(0.5, v * INJURY_RATIO)) {
        if (p === st) {
          st.injured++;
          if (inArmy(st, y) && rnd(seed, 'leg', y) < 0.5) st.leg = true;
          ev(st, { y, t: 'injury', who: 'self', army: inArmy(st, y), leg: st.leg });
        } else if (!p.injured) { p.injured = 1; st.log.push({ y, t: 'injury', who: p.id }); }
      }
    });

    // 出国打工期满
    if (st.workAbroad && st.workAbroad === y && st.loc === 'abroad2' && st.alive) {
      st.loc = 'home'; st.workAbroad = 0; bump(st, { money: 15, mood: 10 }); st.log.push({ y, t: 'backFromWork' });
    }
    // 晚年：心里的伤
    if (st.alive && st.trauma && st.army && st.army.done && y > st.army.until + 3 && rnd(seed, 'night', y) < 0.08)
      st.log.push({ y, t: 'nightmare' });

    if (st.alive) yearlyDrift(st, x);
    st.year++; st.age++;
    if (st.age > 105 && st.alive) kill(st, st, 'old');
    return st;
  }

  // ---------------- 职业 ----------------
  const OCC = {
    0: ['farm', 'herd', 'market', 'labor'], 1: ['farm', 'tailor', 'driver', 'market', 'mechanic', 'builder'],
    2: ['shop', 'mechanic', 'electric', 'tailor', 'driver', 'nurse'], 3: ['teacher', 'nurse', 'clerk', 'electric', 'shop'],
    4: ['teacher', 'doctor', 'engineer', 'clerk', 'journalist'],
  };
  const CARE_OCC = { football: 'coach', drawing: 'painter', radio: 'electric', books: 'teacher', school: 'teacher',
    music: 'musician', animal: 'vet', garden: 'farm', river: 'fisher', toy: 'carpenter' };
  function occupation(st) {
    const n = st.school.years;
    const tier = n >= 16 ? 4 : n >= 12 ? 3 : n >= 9 ? 2 : n >= 5 ? 1 : 0;
    const top = topCare(st, true);
    const need = { animal: 3, books: 3, school: 3 };
    if (top && CARE_OCC[top] && tier >= (need[top] || 1)) return CARE_OCC[top];
    if (st.line !== 'peace' && st.loc === 'abroad') return pick(['labor', 'builder', 'market', 'camp'], rnd(st.seed, 'occA'));
    return pick(OCC[tier], rnd(st.seed, 'occ'));
  }
  function topCare(st, hobbyOnly) {
    let best = null, n = 0;
    for (const k in st.care) {
      if (hobbyOnly && (k.indexOf('fam:') === 0 || k === 'homeland' || k === 'comrade')) continue;
      if (st.care[k] > n) { n = st.care[k]; best = k; }
    }
    return best;
  }

  // ---------------- 和平线 ----------------
  function peaceLife(st) {
    const p = newLife(st.seed, st.by, 'peace');
    p.care = JSON.parse(JSON.stringify(st.care));
    p.eduTarget = Math.max(eduTarget(p, 'peace'), st.eduMax || 0);
    p.suppress = true;
    while (p.alive) finishYear(p);
    return p;

      case 'backFromWork': return '你从国外回来了，带回了盖房子的钱。';
      case 'dropout': return '你再也没有回到学校。';
      case 'schoolLost': return e.abroad ? '营地里的学校坐不下，你没能上学。' : '学校关了门。';
      case 'hunger': return '这一年，常常吃不饱。';
      case 'letter': return '收到了' + who(st, e.who) + '的信。只有几行字。';
      case 'letterHome': return '你给家里写了一封信。';
      case 'training': return '新兵训练。每天跑步、挖壕沟。';
      case 'nightmare': return '你又在夜里惊醒了。';
      case 'robbed': return '粮仓被人抢了。';
      case 'schoolStart': return '你上学了。';
      case 'draftNone': return '镇上的年轻人都被带走了。';

    }
    if (CHOICE_T[e.t]) {
      const c = st.chosen.find(x => x.id === CHOICE_T[e.t] && x.year === e.y);
      return c ? choiceLine(st, c.id, c.opt, c) : '';
    }

  }
  const WAR_DAILY = {
    in: ['停电的晚上，全家围着一盏油灯。', '你学会了分辨远处的声音。', '市场只开半天，面包涨了三倍。', '夜里，你们睡在走廊里，离窗户远一点。',
      '妈妈把证件缝进了衣服里。', '你在废墟里捡到一个瘪了的足球。', '学校的墙上多了很多弹孔。', '水管断了，每天去井边打水。',
      '宵禁。天黑前必须回家。', '去集市要过三个检查站。', '弹片打碎了窗户，你们用塑料布糊上。', '邻居一家走了，门没锁。'],
    near: ['车站里挤满了从' + '北边逃来的人。', '面粉的价钱一个月涨了一倍。', '班上多了几个说话口音不一样的孩子。', '夜里偶尔能听到很远的闷响。',
      '镇上的墙上贴满了征兵的告示。', '加油站排起了长队。'],
    far: ['收音机里每天都在报前线的消息。', '物价又涨了。', '街上多了穿军装的人。', '电视里在放很远的地方的废墟。', '有人在给前线募捐。'],
    city: ['你们和亲戚挤在一间屋里。', '城里的孩子笑你的口音。', '爸爸每天去街口等零工。', '亲戚家的脸色一天比一天难看。'],
  };
  function warDaily(st, e) { return pick(WAR_DAILY[e.zone] || WAR_DAILY.far, (e.k % 997) / 997); }

  const DAILY = {
    baby: ['你学会了走路，摔了很多次。', '妈妈背着你去赶集。', '你第一次叫出了「妈妈」。', '雨季来了，院子里全是泥。',
      '奶奶给你讲了一个很长的故事。', '你在村口的河边玩了一整个下午。', '你发了一场烧，妈妈守了你三个晚上。', '你有了一个最好的朋友，叫{friend}。', '你追着一只鸡满院子跑。', '你把妈妈的鞋穿在脚上，走了一圈。', '下了一场很大的雨，你在门口看了很久。', '你学会了数到十。', '爸爸把你扛在肩上去看集市。'],
    kid: ['你在课本的空白处画满了小人。', '放学路上，你和{friend}比谁跑得快。', '过节了，家里杀了一只鸡。', '你偷偷爬上屋顶看星星。',
      '爸爸教你修自行车。', '你第一次喜欢上一个人，没敢说。', '那年夏天特别热，你们在河里泡了一个月。', '你和{friend}为了一件小事吵架，第二天就和好了。',
      '你考了全班第三。', '你学会了一首歌，唱了一整个夏天。', '你攒了半年的钱，买了一个皮球。', '你和{friend}在墙上刻下了自己的名字。', '你第一次一个人走夜路回家。', '你帮奶奶穿针，她夸你眼睛好。', '你偷偷骑走了邻居的自行车，摔破了膝盖。', '镇上来了放电影的，你看到了海。', '你的个子一年蹿高了一大截。', '你和家里人去参加了一场婚礼，吃得很撑。', '你养的小猫生了三只小猫。'],
    youth: ['你在集市上帮人卸货，挣了第一笔钱。', '你和朋友们熬夜听了一场球赛。', '你学会了开车。', '表姐结婚，你跳了一整晚的舞。',
      '你在镇上租了一间小屋。', '你攒钱买了一辆二手摩托。', '你和{friend}去了一趟海边。', '你开始留胡子了，大家都笑你。', '你在婚礼上认识了很多人。', '你第一次自己交房租。', '你学会了做饭，虽然不太好吃。', '你在河边坐了一个下午，什么都没想。', '你给家里寄了一点钱。', '你和朋友们凑钱买了一台旧电视。'],
    adult: ['孩子们长得太快了。', '你把院子里的墙重新刷了一遍。', '那年收成不错。', '你和家人在门口坐到很晚。', '你开始有白头发了。',
      '你给妈妈过了生日。', '你学会了做奶奶拿手的那道菜。', '你在门口种了一棵树。', '日子平平常常地过去。', '家里换了一张新桌子。', '你在集市上和老朋友聊了一下午。', '你学会了用手机给远方的人打电话。', '那年冬天很冷，全家挤在一个屋里烤火。', '你开始早睡了。', '你修好了漏雨的屋顶。'],
    old: ['你喜欢在门口晒太阳。', '孩子们回来看你，屋里吵吵闹闹。', '你的膝盖开始疼了。', '你常常想起小时候的河。', '你又讲起了年轻时候的事。',
      '你给邻居家的孩子修好了收音机。', '你把老照片一张一张拿出来看。', '你开始记不住新认识的人的名字。', '你在院子里种的树结果了。', '你每天早上去同一个地方喝茶。', '你参加了老朋友的葬礼。'],
    abroad: ['帐篷换成了铁皮房。', '你学会了一种新的语言。', '每个月的第一天，排队领面粉和油。', '你在营地的空地上踢球。',
      '你常常梦见老家的院子。', '你在异乡的工地上干活。'],
    abroad2: ['你在一个陌生的城市洗盘子。', '你学会了用新的语言填表。', '邻居听不懂你的名字，叫你另一个名字。', '你给家里打电话，信号很差。'],
    after: ['镇上开始有人重新盖房子。', '学校重新开门了，教室里少了一半人。', '你在废墟边种了一棵树。', '市场又热闹起来了。'],
  };
  function filler(st, y, used) {
    const a = y - st.by;
    let band = a < 7 ? 'baby' : a < 18 ? 'kid' : a < 30 ? 'youth' : a < 60 ? 'adult' : 'old';
    if (st.loc === 'abroad') band = 'abroad';
    if (st.loc === 'abroad2' && !st.workAbroad) band = 'abroad2';
    if (!E.isWar(st, y) && st.lastWarYear && y - st.lastWarYear <= 4 && st.loc === 'home' && R(st.seed, 'af', y) < 0.5) band = 'after';
    let arr = DAILY[band];
    if (band === 'kid' && st.school.years >= st.eduTarget) arr = arr.filter(x => !/课本|放学|全班/.test(x));
    if (arr.every(x => used[x])) arr.forEach(x => { if (used[x] < y - 3) delete used[x]; });   // 用完一轮就重置，只避开最近几年
    let i = Math.floor(R(st.seed, 'fill', y) * arr.length);
    for (let t = 0; t < arr.length && used[arr[i]]; t++) i = (i + 1) % arr.length;
    used[arr[i]] = y;
    let s = arr[i].replace('{friend}', friendName(st));
    if (y >= E.NOW) s = '也许，' + s;
    return s;
  }

  // 给一年挑一两句
  function narrateYear(st, y, used) {
    const evs = st.log.filter(e => e.y === y);
    // 选择那一句和「被带走 / 出发」类事件说的是同一件事时，只留后者
    const dup = evs.some(e => /^(famDrafted|armyStart|sentAbroad|move|daughterMarried|prison|deserted)$/.test(e.t));
    const scored = evs.map(e => ({ e, p: PRI.indexOf(key(e)) }))
      .filter(x => x.p >= 0 && !(dup && key(x.e) === 'choice'))
      .filter(x => !(x.e.t === 'letter' && evs.some(e => e.t === 'famBack' && e.who === x.e.who)))
      .sort((a, b) => a.p - b.p);
    const parts = [];
    for (const x of scored) {
      const s = line(st, x.e);
      if (!s || parts.indexOf(s) >= 0) continue;
      parts.push(s);
      if (x.e.t === 'death' || parts.length >= 2) break;
    }
    const big = scored.length && scored[0].p < PRI.indexOf('zoneShift');
    if (!parts.length) parts.push(filler(st, y, used));
    let text = parts.join('');
    if (y >= E.NOW && text.indexOf('也许') < 0) text = '也许，' + text;
    // 在乎的东西被战争碰到：加重
    const top = Object.keys(st.care).sort((a, b) => st.care[b] - st.care[a])[0];
    if (top) {
      const fd = evs.find(e => e.t === 'famDeath' && 'fam:' + e.who === top);
      if (fd) text += '那是你最在乎的人。';
      else if ((top === 'school' || top === 'books') && evs.some(e => e.t === 'schoolLost' || e.t === 'dropout')) text += '你最舍不得的，就是教室。';
      else if ((top === 'home' || top === 'garden') && evs.some(e => e.t === 'house')) text += '院子也没了。';
      else if (top === 'animal' && evs.some(e => e.t === 'move')) text += '羊没能带走。';
      else if (top === 'football' && evs.some(e => e.t === 'injury' && e.who === 'self' && e.leg)) text += '你再也踢不了球了。';
    }
    return { text, big: !!big, dead: evs.some(e => e.t === 'death'), filler: !scored.length };
  }

  // ---------------- 回看 ----------------
  const LOC_PHRASE = {
    draft: { go: '你会跟他们走', hide: '你会躲进阁楼', leave: '你会一个人去国外', hideHim: '他会躲起来', letGo: '他会跟他们走',
      selfGo: '你会跟他们走', no: '你会留在家里', sendAbroad: '他会被送出国', giveMoney: '他会带着你的钱走', silent: '他会走' },
    house: { repair: '你们会修好房子住下去', move: '你们会挤在地下室', city: '你们会去城里', abroad: '你们会越过边境' },
    post: { front: '你会去前线', rear: '你会留在后方' },
    neighbor: { hideThem: '邻居会躲在你家', refuse: '门会一直关着' },
    hospital: { stayPost: '你会留在医院', evac: '你会撤到城里' },
    sick: { toCity: '你们会送' + '病人进城', care: '你们会守在家里' },
    relAbroad: { goAbroad: '你们会去国外', stayHome: '你们会留下' },
    hoard: { hoardSell: '你会囤着面粉', fair: '你会按原价卖', give: '你会把面粉分掉' },
    smuggleGoods: { run: '你会帮人运货', noRun: '你不会碰那些货' },
    buyHouse: { buy: '你会买下那栋房子', noBuy: '你不会买', keepFor: '你会替他们看着房子' },
    sendKid: { sendKid: '孩子会被送出国', keepKid: '孩子会留在身边' },
    desert: { deserting: '你会跑', stayArmy: '你会留在战壕里' },
    smuggler: { goFar: '你会上路去更远的国家', stayCamp: '你会留在营地' },
    ret: { back: '你们会回家', remain: '你们会留在这里' },
    study: { keepStudy: '你会继续读书', goWork: '你会去干活' },
    workAbroad: { goWorkAbroad: '你会去国外的工地', stayWork: '你会留在家' },
  };
  function diffPhrase(st, it, B) {
    const w = it.who ? who(st, it.who) : '';
    switch (it.k) {
      case 'selfDies': return (it.y - st.by) + '岁那年，你会' + (it.cause === 'travel' ? '死在路上' : '离开这个世界');
      case 'selfLives': return '你会活下来';
      case 'selfLonger': return '你会多活' + it.n + '年';
      case 'selfShorter': return '你会早' + it.n + '年离开';
      case 'famDies': return w + (it.cause === 'travel' ? '会死在路上' : '会没能活下来');
      case 'famLives': return w + '会活着';
      case 'selfInjured': return '你会受伤';
      case 'noInjury': return '你不会受伤';
      case 'leg': return '你的腿会受伤';
      case 'neverServed': return '你不会上前线';
      case 'houseHit': return '房子会被炮弹打中';
      case 'prison': return '你会被抓进牢里';
      case 'moreHunger': return '会多挨' + it.n + '年饿';
      case 'lessHunger': return '会少挨' + it.n + '年饿';
      case 'moreSchool': return '你能多读' + it.n + '年书';
      case 'lessSchool': return '你会少读' + it.n + '年书';
      case 'richer': return '手头会宽裕很多';
      case 'poorer': return '会穷很多';
      case 'moreFriends': return '会有更多人愿意帮你';
      case 'lonelier': return '身边的人会少很多';
      case 'married': return '你会在那几年结婚';
      case 'friendDies': return '朋友' + friendName(st) + '会没能活下来';
      case 'friendLives': return '朋友' + friendName(st) + '会活着';
      case 'moreKids': return '家里会多' + (it.n > 1 ? it.n + '个' : '一个') + '孩子';
    }
    return '';
  }
  // 返回 { head, mine, alts:[{label, text}] }
  function recapText(st, stage, alts) {
    const c = stage.choice, years = st.year - stage.start;
    const sc = scenarioText(st, c);
    const mineEvs = st.log.filter(e => e.y >= stage.start && e.y < st.year && /^(death|famDeath|injury|house|famBack|comradeDeath|prison|move|caught|famCaught)$/.test(e.t));
    const mine = mineEvs.slice(0, 2).map(e => line(st, e)).filter(Boolean).join('') || yrs(years) + '，没有人出事。';
    const out = alts.map(a => {
      const parts = a.diff.items.slice(0, 2).map(it => diffPhrase(st, it, a.branch)).filter(Boolean);
      const base = (LOC_PHRASE[c.id] && LOC_PHRASE[c.id][a.opt]) || '';
      let text;
      if (!parts.length) text = (base ? base + '；' : '') + yrs(years) + '会和你经历的差不多。';
      else text = (base ? base + '；' : '') + parts.join('，') + '。';
      return { label: sc.o[a.opt] || a.opt, text };
    });
    return { head: yrs(years) + '，你选择了「' + (sc.o[stage.opt] || stage.opt) + '」。', mine, alts: out };
  }
  // 结局卡上「最难的一次选择」
  function hardestLine(st, recaps) {
    let best = null, score = -1;
    recaps.forEach(r => r.alts.forEach(a => {
      a.diff.items.forEach(it => {
        const s = { selfLives: 10, selfDies: 9, famLives: 8, famDies: 6, friendLives: 7, friendDies: 5, selfLonger: 7, leg: 5, neverServed: 4, houseHit: 3, moreSchool: 2 }[it.k] || 0;
        if (s > score) { score = s; best = { r, a, it }; }
      });
    }));
    if (!best || score < 2) return null;
    const sc = scenarioText(st, best.r.choice);
    if (best.r.choice.id === 'sisSchool') sc.o = { sendSis: '送她去城里读书', keepSis: '留她在家' };
    const lab = sc.o[best.a.opt] || '';
    const p = pron(st);
    const ph = diffPhrase(st, best.it, best.a.branch).replace(/你/g, p);
    return '那年如果「' + lab + '」，' + ph + '。';
  }

  // ---------------- 反思问题 ----------------
  const ASK = { 5: '五岁的你，最喜欢什么？', 15: '十五岁，你想成为什么样的人？', 30: '三十岁，你最想念谁？', 50: '五十岁，有什么话一直没说出口？', 70: '七十岁，回头看，哪一年最好？' };

  // ---------------- 结局 ----------------
  const EDU = n => n >= 16 ? '读完了大学' : n >= 12 ? '读完了高中' : n >= 9 ? '读完了初中' : n >= 6 ? '读完了小学' : n > 0 ? '读了' + n + '年书' : '没上过学';
  function endingText(st, en, meta, recaps) {
    const p = pron(st), nm = selfName(st);
    const lines = [];
    if (en.type === 'early') lines.push(en.age < 1 ? p + '没能活过一岁。' : p + '死于' + en.age + '岁。');
    else {
      const bits = [p + '活到了' + en.age + '岁'];
      if (en.lostAll) bits.push('送走了' + en.lostAll + '位亲人');
      bits.push(EDU(en.edu).replace('读完了', '读完了'));
      lines.push(bits.join('，') + '。');
    }
    if (en.served) lines.push(en.leg ? p + '在前线留下了一条不好使的腿。' : en.trauma ? p + '从前线回来以后，常常在夜里惊醒。' : p + '当过兵。');
    if (en.profiteer) lines.push('战争让' + p + '富了。');
    const pe = en.peace;
    if (pe.age <= en.age) {
      const pl = en.age < 5 ? '即使没有战争，' + p + '也可能熬不过那个冬天。' : '即使没有战争，' + p + '的一生也差不多这么长。';
      return finish(pl);
    }
    let peaceLine = '没有战争：本可以活到' + pe.age + '岁，' + EDU(pe.edu).replace('读完了', '读完');
    if (pe.occ) peaceLine += '，成为一名' + OCC_NOUN[pe.occ];
    if (pe.kids) peaceLine += '，有' + pe.kids + '个孩子';
    peaceLine += '。';
    return finish(peaceLine);
    function finish(peaceLine) {
    const hard = hardestLine(st, recaps);
    const numbers = {
      early: '2024 年，全世界约有 ' + Math.round(meta.worldConflictDeaths2024 / 10000) + ' 万人死于武装冲突。',
      soldier: '2024 年，全世界约有 ' + Math.round(meta.worldConflictDeaths2024 / 10000) + ' 万人死于武装冲突。',
      displaced: '此刻，全世界约有 1.2 亿人被迫离开家园。',
      stayed: '此刻，全球约每 6 个孩子里，就有 1 个生活在冲突地区。',
      far: '此刻，全球约每 6 个孩子里，就有 1 个生活在冲突地区。',
    };
    const title = { early: '没过完的一生', soldier: '从前线回来的人', displaced: '离开家的人', stayed: '留下来的人', far: '远处的战争' }[en.type];
    return {
      title, name: nm, main: lines, peace: peaceLine, hard,
      took: en.took ? p + '带走的：' + itemLabel(st, en.took) : null,
      enemy: en.served ? '那几年，对面的阵地上，也有一个和' + p + '同年出生的人。' : null,
      number: numbers[en.type],
    };
    }
  }

  // ---------------- 出生卡 ----------------
  function birthText(st) {
    const c = st.c;
    const fam = st.fam.filter(p => p.alive && !p.unborn).map(p => who(st, p.id));
    return {
      name: selfName(st), sex: st.sex === 'f' ? '女' : '男', year: st.by, country: c.name, region: region(st),
      family: fam.length ? fam.join('、') : '',
      home: (st.urban ? '城里' : '乡下') + '，' + (st.income < 0.33 ? '家里很穷' : st.income < 0.7 ? '家里过得去' : '家里条件不错'),
    };
  }

  return {
    selfName, personName, region, relLabel, who, careLabel, itemLabel, hintText, scenarioText, choiceLine,
    narrateYear, recapText, hardestLine, endingText, birthText, ASK, OCC, OCC_NOUN, STAT_NAME, pron, comradeName,
  };
});

<script>/* 《本该有的一生》章节文案：把引擎里的一段人生，讲成 12–18 个章节。
 *
 * 一致性约定：每句话用 L(文本, 需要在场的人) 生成。refs 里的人必须「活着且在你身边」，
 * 由 tools/consistency.js 批量检查；回忆里提到的人不进 refs。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'), require('./text.js'));
  else root.Story = factory(root.Engine, root.Text);
})(typeof self !== 'undefined' ? self : this, function (E, T) {
  'use strict';
  const R = E.rnd;
  const pick = (arr, r) => arr[Math.min(arr.length - 1, Math.floor(r * arr.length))];
  const L = (t, refs, together) => ({ t, refs: refs || [], together: !!together });   // together：这句话要求两人此刻在一起

  function sisNews(st, y, e) {
    const n = sisName(st);
    if (e.t === 'sisNurse') return { key: 'sisNews', title: n, lines: [L('战地诊所缺人。' + ageOf(st, 'sis', y) + '岁的' + n + '，在那里一干就是好几年。'), L('她在信里写：今天给一个男孩缝了七针，他一直喊妈妈。')] };
    if (e.t === 'sisMarried') return { key: 'sisNews', title: n, lines: [L(n + '十六岁那年，嫁去了另一个镇。家里实在太穷了。'), L(st.pocket.indexOf('drawing:sis') >= 0 ? '走的那天，她把那张画要了回去，看了很久，又塞回你手里：「还是你收着。」' : '走的那天，她没有回头。')] };
    if (e.t === 'sisBack') return { key: 'sisNews', title: n, lines: [L(n + '在城里读完了书，回来了。'), L('她给你看她的毕业证，上面的字，比小时候写得好看多了。')] };
    if (e.t === 'sentAbroad' && e.who === 'sis') return { key: 'sisNews', title: n, lines: [L(n + '走了。从此只能在电话里听到她的声音。')] };
    return null;
  }
  function warEnd(st, y, e) {
    const lines = [L(e.away ? '老家那边的枪声停了。' : '枪声停了。没人敢相信，但它真的停了。')];
    const s = sis(st);
    if (s && s.alive && here(st, 'sis')) lines.push(L('你和' + sisName(st) + '在老房子边上坐了一个下午。她说：「我还记得那张画。」', ['sis'], true));
    else if (s && s.diedYear) lines.push(L('你去了那口井。井还在。'));
    if (st.profiteer && st.stats.money >= 55) lines.push(L('你成了镇上最有钱的人之一。可很少有人来你家吃饭。'));
    return { key: 'warEnd', title: '枪声停了', lines, scene: { time: 'day' } };
  }

  // ---------------- 选择章节 ----------------
  const SC_TITLE = { draft: '有人来敲门', house: '怎么办', post: '训练结束', sisSchool: '学校', neighbor: '半夜', hospital: '医院',
    grain: '粮食', sick: '病', relAbroad: '电话', refugees: '车站', hoard: '面粉', smuggleGoods: '货', buyHouse: '隔壁', famine: '口粮',
    sendKid: '送走', earlyMarry: '提亲', desert: '夜里', smuggler: '位置', ret: '回去', enemy: '市场', comrade: '托付', rebuild: '重建',
    study: '十五岁', migrate: '进城', workAbroad: '工地' };
  function choice(st, p) {
    const sc = T.scenarioText(st, p), lines = [];
    if (p.id === 'sisSchool') {
      const n = sisName(st);
      lines.push(L('学校关了。城里的学校还开着，可是要住在姑妈家，一个月的饭钱，顶家里半个月。'),
        L(n + '没说想去。她只是每天晚上，把旧课本从头翻到尾。', ['sis']));
      sc.o = { sendSis: '送她去城里读书', keepSis: '留她在家' };
    } else if (p.id === 'draft' && p.role === 'self') {
      lines.push(L('镇上来了人，要年轻人跟他们走。名单上有你的名字。'));
      if (here(st, 'mom')) lines.push(L('妈妈一夜没睡。', ['mom']));
      if (here(st, 'dad')) lines.push(L('爸爸说：「你自己决定。」', ['dad']));
    } else if (p.id === 'study') {
      lines.push(L(st.school.years >= 9 ? '初中念完了。家里问你：还读吗？' : '书断断续续念了' + st.school.years + '年。家里问你：还读吗？'));
      if (here(st, 'sis')) lines.push(L(sisName(st) + '趴在门边听。', ['sis']));
    } else lines.push(L(sc.q, p.who && p.who !== 'self' ? [p.who] : []));
    return {
      key: 'choice:' + p.id, title: SC_TITLE[p.id] || '', lines,
      options: p.options.map(o => ({ id: o, label: sc.o[o] || o, hint: T.hintText(p.hints[o]) })),
    };
  }
  // 逃难时只能带一样
  function takeOne(st) {
    return { key: 'takeOne', title: '只能带一样', lines: [L('要走了。口袋里的东西，只能带走一样。')],
      options: st.pocket.map((it, i) => ({ id: 'i' + i, label: T.itemLabel(st, it), hint: '' })) };
  }
  function careContext(st) {
    const a = st.age;
    if (st.loc === 'abroad') return '营地里的日子很长。你' + a + '岁了。';
    if (st.army && !st.army.done) return '在部队的第' + (st.year - st.army.start + 1) + '年。';
    if (E.isWar(st, st.year)) return '仗还在打。你' + a + '岁了。';
    return a < 20 ? '你' + a + '岁了，个子蹿得很快。' : '你' + a + '岁了。';
  }
  function careChoice(st, p) {
    return { key: 'care', title: '这一年', lines: [L(careContext(st)), L('这一年，你最在乎……')],
      options: p.options.map(o => ({ id: o, label: T.careLabel(st, o), hint: '' })) };
  }

  // ---------------- 一年结束后：这一年值得讲成章节吗 ----------------
  const LOSS_REL = { sis: 1, dad: 1, mom: 1, sp: 1, kid: 1 };
  function chaptersOfYear(st, y) {
    const evs = evsOf(st, y), out = [], a = y - st.by;
    const push = c => { if (c && c.lines && c.lines.length) out.push(Object.assign({ y, age: a }, c)); };
    if (y >= E.NOW && st.alive) return out;            // 2026 年以后只在最后讲
    evs.forEach(e => {
      if (e.t === 'sibBorn' && e.who === 'sis') push(sisBirth(st, y));
      if ((e.t === 'warStart' && y > st.by) || e.t === 'warAgain') push(war(st, y, e));
      if (e.t === 'draftDone' && e.role === 'child') push(draftScript(st, y, e));
      if (e.t === 'house') push(house(st, y, e));
      if (e.t === 'move') push(leave(st, y, e));
      if (e.t === 'famDeath') {
        const p = fam(st, e.who);
        if (LOSS_REL[p.rel] || e.cause === 'violence' || e.cause === 'travel') push(loss(st, y, e));
      }
      if (e.t === 'friendDeath' && st.friend.met) push(friendLoss(st, y, e));
      if (e.t === 'friendDrafted' || e.t === 'friendLeft' || e.t === 'friendBack') push(friendNews(st, y, e));
      if (/^(armyStart|demob|pow|comradeDeath)$/.test(e.t) || (e.t === 'injury' && e.army)) push(army(st, y, e));
      if (/^(sisNurse|sisMarried|sisBack)$/.test(e.t) || (e.t === 'sentAbroad' && e.who === 'sis')) push(sisNews(st, y, e));
      if (e.t === 'warEnd') push(warEnd(st, y, e));
      if (e.t === 'marry') push(marry(st, y));
      if (e.t === 'kid' && st.fam.filter(p => p.rel === 'kid').length === 1) push(kid(st, y, e));
    });
    const d5 = st.fam.find(p => p.rel === 'kid' && p.sex === 'f' && p.alive && y - p.by === 5);
    if (d5 && !st.echoed) { st.echoed = true; push(echo(st, y, d5)); }
    if (a === 45 && st.alive) push(mid(st, y));
    if (a === 66 && st.alive) push(old(st, y));
    const ORDER = { war: 0, draftScript: 1, house: 2, loss: 3, friendLoss: 4, leave: 5, army: 6 };
    out.sort((a, b) => (ORDER[a.key] ?? 9) - (ORDER[b.key] ?? 9));
    return out.slice(0, 3);
  }
  // 物品带出来的章节（在年初的交互阶段）
  function itemChapter(st, y, item) {
    if (item === 'drawing:sis') return Object.assign({ y, age: y - st.by }, drawing(st, y));
    if (item === 'football') { const f = friend(st, y); return f ? Object.assign({ y, age: y - st.by }, f) : null; }
    return null;
  }

  // ---------------- 章节之间的一句话 ----------------
  function bridge(st, y0, y1) {
    y1 = Math.min(y1, E.NOW);
    if (y1 <= y0) return null;
    const bits = [];
    const evs = st.log.filter(e => e.y >= y0 && e.y < y1);
    evs.forEach(e => {
      if (e.t === 'schoolStart') bits.push('你上了学');
      if (e.t === 'grad') bits.push({ 6: '你读完了小学', 9: '你读完了初中', 12: '你读完了高中', 16: '你读完了大学' }[e.n]);
      if (e.t === 'sibBorn' && e.who !== 'sis') bits.push(T.who(st, e.who) + '出生了');
      if (e.t === 'work') bits.push('你开始' + T.OCC[e.occ]);
      if (e.t === 'kid' && st.fam.filter(p => p.rel === 'kid' && p.by < e.y).length > 0) bits.push(T.who(st, e.who) + '出生了');
      if (e.t === 'famDeath' && !LOSS_REL[fam(st, e.who).rel] && e.cause !== 'violence' && e.cause !== 'travel') bits.push(T.who(st, e.who) + '走了');
      if (e.t === 'dropout') bits.push('你再也没有回到学校');
      if (e.t === 'famBack') bits.push(T.who(st, e.who) + '从部队回来了');
    });
    const warYears = evs.filter(e => e.t === 'warDaily').length;
    const n = y1 - y0, span = n === 1 ? y0 + ' 年' : y0 + '–' + (y1 - 1);
    let s;
    if (bits.length) s = bits.slice(0, 3).join('；') + '。';
    else if (warYears >= Math.max(1, n / 2)) s = '仗一直没停。日子一天一天熬过去。';
    else s = n > 1 ? '接下来的' + n + '年，日子平平常常。' : '这一年，日子平平常常。';
    return { span, text: s };
  }

  // ---------------- 最后一章 ----------------
  function final(st) {
    const y = st.deathYear, a = y - st.by, lines = [];
    const future = y >= E.NOW;
    // 2026 年以后的部分，用两三句「也许」带过
    if (future) {
      const after = st.log.filter(e => e.y >= E.NOW && (e.t === 'marry' || e.t === 'kid' || (e.t === 'famDeath' && LOSS_REL[fam(st, e.who).rel])));
      const bits = after.slice(0, 3).map(e => e.t === 'marry' ? '你结了婚' : e.t === 'kid' ? T.who(st, e.who) + '出生了' : T.who(st, e.who) + '走了');
      lines.push(L('后来的事，还没有发生。' + (bits.length ? '也许，' + bits.join('，') + '。' : '也许，日子会平平常常地过下去。')));
    }
    const c = st.cause;
    if (c === 'violence') lines.push(L(a < 15 ? '那一年，你没能活下来。你才' + a + '岁。' : (st.army && !st.army.done ? '那一年，你没有从前线回来。' : '这一年，你死于冲突。')));
    else if (c === 'travel') lines.push(L('你没能走到。'));
    else if (c === 'child') lines.push(L('你没能熬过那个冬天。'));
    else if (c === 'old') lines.push(L((future ? '也许，' : '') + '你在' + a + '岁那年，在睡梦中离开了。'));
    else lines.push(L((future ? '也许，' : '') + '你在' + a + '岁那年病倒了，再也没有起来。'));
    // 妹妹的信：她还活着、你活到了 50 岁以后
    const s = sis(st);
    let letter = null;
    if (s && s.alive && a >= 50) {
      const n = sisName(st), body = [];
      if (st.sisSchool === 'sendSis') body.push('我常常想起那年学校关门，你把我送去了城里。');
      else if (st.sisSchool === 'keepSis') body.push('我常常想起那年学校关门。你说，等仗打完，就送我回学校。');
      else body.push('我常常想起小时候，你背着我去河边。');
      body.push(sisPathLine(st, y).replace(n, '我').replace('她说，', '').replace(/她/g, '我'));
      body.push(st.pocket.indexOf('drawing:sis') >= 0 ? '那张画你还留着吗？留着吧。那是我唯一一张，长大以后的样子。' : '那张画丢了也没关系。我还记得我画的是什么。');
      letter = { to: sib(st) + '：', body, from: '——' + n };
    }
    return { key: 'final', y, age: a, title: '最后', lines, letter, scene: { time: 'dusk' } };
  }

  // 结局卡上属于三个人的几行
  function trio(st) {
    const out = [], s = sis(st), n = sisName(st), f = st.friend, fn = friendName(st);
    if (s && !s.unborn) {
      if (s.diedYear && (s.cause === 'violence' || s.cause === 'travel' || s.diedYear - s.by < 40)) out.push(n + '死于' + (s.diedYear - s.by) + '岁。如果没有战争，她会是一名医生。');
      else out.push(sisPathLine(st, st.deathYear || st.year).replace('她说，缝过的伤口，比她画过的画还多。', '') + '如果没有战争，她会是一名医生。');
    }
    if (f && f.met && f.diedYear && f.cause === 'violence') out.push(fn + '死于' + (f.diedYear - f.by) + '岁。' + (f.sex === 'f' ? '她' : '他') + '想去城里的球队。');
    const dad = fam(st, 'dad');
    if (dad && dad.diedYear && dad.diedYear >= st.by && (dad.cause === 'violence' || dad.away === 'army')) out.push('爸爸死于' + dad.diedYear + '年。那台收音机，你留到了最后。');
    return out;
  }

  return { birth, chaptersOfYear, itemChapter, choice, takeOne, careChoice, bridge, final, trio, sisName, friendName, here, alive };
});

<script>/* 《本该有的一生》流程：一章一章往外吐，界面和测试工具共用。
 * const r = Runner.create(st); let ch = r.next(); ... r.answer(ch, optionId) ...
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'), require('./text.js'), require('./story.js'));
  else root.Runner = factory(root.Engine, root.Text, root.Story);
})(typeof self !== 'undefined' ? self : this, function (E, T, S) {
  'use strict';
  // 回看只在这些差别出现时才打扰玩家
  const MEANINGFUL = new Set(['selfDies', 'selfLives', 'selfLonger', 'selfShorter', 'famDies', 'famLives', 'friendDies', 'friendLives',
    'neverServed', 'leg', 'selfInjured', 'houseHit', 'prison']);

  function create(st) {
    const R = { st, cq: [], queue: [], qYear: null, pend: null, snap: null, recaps: [], meta: [], lastY: st.by, n: 0, started: false, finalShown: false };

    function emit(ch) {
      if (ch.key !== 'recap') ch.n = ++R.n;
      if (ch.y == null) ch.y = st.year;
      if (ch.age == null) ch.age = ch.y - st.by;
      if (!ch.bridge && ch.y > R.lastY && ch.key !== 'recap') ch.bridge = S.bridge(st, R.lastY, ch.y);
      if (ch.key !== 'recap') R.lastY = Math.max(R.lastY, ch.endOfYear ? ch.y + 1 : ch.y);
      return ch;
    }
    function closeStage() {
      const pend = R.pend; R.pend = null;
      const alts = pend.choice.options.filter(o => o !== pend.opt).map(o => {
        const br = E.runBranch(R.snap, pend.choice, o, st.year);
        return { opt: o, branch: br, diff: E.diff(st, br, pend.start) };
      });
      R.recaps.push({ choice: pend.choice, alts });
      const good = alts.filter(a => a.diff.items.some(it => MEANINGFUL.has(it.k)));
      if (!good.length) return;
      const r = T.recapText(st, pend, good.map(a => Object.assign({}, a, { diff: { items: a.diff.items.filter(it => MEANINGFUL.has(it.k) || it.k === 'lessSchool' || it.k === 'moreSchool') } })));
      if (pend.choice.id === 'sisSchool') {
        const lab = { sendSis: '送她去城里读书', keepSis: '留她在家' };
        r.head = r.head.replace(/「[^」]*」/, '「' + lab[pend.opt] + '」');
        r.alts.forEach((a, i) => { a.label = lab[good[i].opt]; });
      }
      R.cq.push({ key: 'recap', title: '回看', y: st.year - 1, recap: r });
    }
    function dropIndex() {   // 口袋满了：先放下和三个人无关的东西
      const i = st.pocket.findIndex(it => !/^(drawing:sis|radio|football)$/.test(it));
      return i >= 0 ? i : 0;
    }

    R.next = function () {
      if (!R.started) { R.started = true; return emit(Object.assign({ y: st.by, endOfYear: false }, S.birth(st))); }
      for (let guard = 0; guard < 400; guard++) {
        if (R.cq.length) return emit(R.cq.shift());
        if (!st.alive) {
          if (R.pend) { closeStage(); continue; }
          if (!R.finalShown) { R.finalShown = true; return emit(Object.assign({ endOfYear: true }, S.final(st))); }
          return null;
        }
        if (st.year >= E.NOW) st.suppress = true;
        if (R.qYear !== st.year) { R.queue = E.prompts(st); R.qYear = st.year; }
        while (R.queue.length) {
          const p = R.queue[0];
          if (p.kind === 'pocket') {
            R.queue.shift();
            E.addItem(st, p.item, p.full ? dropIndex() : null);
            // 交互是年初提前算好的；如果这期间已经搬走，朋友就是在新地方认识的
            if (p.item === 'football') st.friend.loc = st.loc === 'moved' ? 'home' : st.loc;
            const ic = st.year < E.NOW && S.itemChapter(st, st.year, p.item);
            if (ic) R.cq.push(ic);
            continue;
          }
          if (p.kind === 'care') {
            R.queue.shift();
            if (st.suppress) { E.applyCare(st, p.options[0]); continue; }
            const last = R.cq[R.cq.length - 1];
            const cc = S.careChoice(st, p);
            if (last && !last.options) { last.options = cc.options; last.care = p; last.lines = last.lines.concat(cc.lines); }
            else R.cq.push(Object.assign({ y: st.year, care: p }, cc));
            continue;
          }
          if (p.kind === 'choice') {
            if (R.pend) { closeStage(); continue; }
            R.queue.shift();
            if (st.suppress) { E.applyChoice(st, p, p.options[0]); continue; }
            R.cq.push(Object.assign({ y: st.year, prompt: p }, S.choice(st, p)));
            break;
          }
          R.queue.shift();
        }
        if (R.cq.length) continue;
        if (st.needTakeOne) {
          if (st.pocket.length > 1 && !st.suppress) { R.cq.push(Object.assign({ y: st.year, take: true }, S.takeOne(st))); continue; }
          E.keepOnly(st, 0);
        }
        // 过一年
        const y = st.year;
        E.finishYear(st);
        const z = E.zoneOf(st, y);
        R.meta.push({ y, cls: (st.loc === 'abroad' || st.loc === 'abroad2') ? 'abroad' : z === 'in' ? 'war' : z ? 'near' : '' });
        const chs = S.chaptersOfYear(st, y).map(c => Object.assign(c, { endOfYear: true }));
        if (st.alive) {
          R.queue = E.prompts(st); R.qYear = st.year;
          // 房子被打中：把「怎么办」直接接在这一章后面
          const hi = R.queue.findIndex(p => p.kind === 'choice' && p.id === 'house');
          const hc = chs.find(c => c.key === 'house');
          if (hi >= 0 && hc && !R.pend) {
            const p = R.queue.splice(hi, 1)[0], cc = S.choice(st, p);
            hc.options = cc.options; hc.prompt = p;
            chs.splice(chs.indexOf(hc), 1); chs.push(hc);   // 带选择的这一章放到当年最后，免得后面的章节写的是选完以后的状态
          }
        }
        if (R.pend && (st.year >= R.pend.start + 5 || !st.alive)) closeStage();
        // 回看放在这一年的章节之前
        const rec = R.cq.filter(c => c.key === 'recap');
        R.cq = R.cq.filter(c => c.key !== 'recap').concat(rec, chs);
      }
      return null;
    };

    // 回答一个章节的选项；返回「选完以后的那一句」
    R.answer = function (ch, id) {
      if (ch.take) { E.keepOnly(st, +id.slice(1)); return '你只带走了' + T.itemLabel(st, st.took) + '。'; }
      if (ch.care) { E.applyCare(st, id); return ''; }
      if (ch.prompt) {
        const p = ch.prompt, snap = E.clone(st);
        E.applyChoice(st, p, id);
        if (p.recap) { R.pend = { choice: p, opt: id, start: st.year }; R.snap = snap; }
        if (p.id === 'sisSchool') return id === 'sendSis' ? '你们把' + S.sisName(st) + '送去了城里。她走的时候，把旧课本也带上了。' : S.sisName(st) + '留在了家里。课本被收进了箱子底。';
        return T.choiceLine(st, p.id, id, p);
      }
      return '';
    };
    return R;
  }
  return { create };
});
</script>
<script>/* 《本该有的一生》界面：开场 → 出生卡 → 逐年 → 交互面板 → 回看 → 结局卡 → 纪念馆 */
(function () {
  'use strict';
  const E = window.Engine, T = window.Text, DATA = window.DATA;
  E.init(DATA);
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 隐私模式等 */ } },
  };
  const MEM_KEY = 'bgy.memorial.v1';
  const SPEEDS = [1, 2, 4];
  const BASE_DELAY = 1700;

  let G = null;

  // ---------------- 画面 ----------------
  const FLAT = new Set('DZA IRQ JOR KWT LBN LBY MRT PSE SDN SYR YEM ESH AFG TJK IRN MLI BFA NER TCD SOM DJI PAK ISR'.split(' '));
  const COLD = new Set('RUS UKR BIH HRV SRB MKD SVN OWID_KOS MDA GEO ARM AZE TJK KGZ AFG IRN TUR KOR PRK'.split(' '));
  function kindOf(p, y) {
    const a = y - p.by;
    if (a < 3) return 'baby';
    if (a < 13) return 'child';
    if (a >= 62) return p.sex === 'f' ? 'elder' : 'oldman';
    return p.sex === 'f' ? 'woman' : 'man';
  }
  // 把某一年的人生状态翻译成场景
  function sceneOf(st, y, last) {
    const zone = E.zoneOf(st, y);
    const army = st.army && !st.army.done && y >= st.army.start;
    const pow = army && st.army.powUntil >= y;
    let setting;
    if (army && !pow) setting = 'trench';
    else if (pow || (st.prison && st.prison >= y) || st.loc === 'moved') setting = 'basement';
    else if (st.loc === 'abroad') setting = 'camp';
    else if (st.loc === 'abroad2') setting = 'abroad';
    else if (st.loc === 'city') setting = 'city';
    else if (st.house.destroyed) setting = 'ruins';
    else setting = st.urban ? 'city' : 'village';
    const r = E.rnd(st.seed, 'tod', y);
    let time = r < 0.4 ? 'day' : r < 0.75 ? 'dusk' : 'night';
    if ((zone === 'in' || setting === 'trench') && E.rnd(st.seed, 'tod2', y) < 0.5) time = 'night';
    if (last) time = 'dusk';
    const wx = E.rnd(st.seed, 'wx', y);
    const weather = COLD.has(st.iso) && wx < 0.22 ? 'snow' : wx < 0.12 ? 'rain' : 'clear';
    const war = setting === 'camp' || setting === 'abroad' ? 0 : setting === 'trench' ? 2 : zone === 'in' ? 2 : zone === 'near' ? 1 : 0;
    let people;
    if (setting === 'trench') {
      people = [{ kind: 'soldier' }, { kind: 'soldier', self: true, gone: !st.alive }, { kind: 'soldier', gone: !!st.army.comradeDied }];
    } else if (st.loc === 'abroad2' && st.workAbroad) {
      people = [{ kind: kindOf(st, y), self: true, gone: !st.alive }];
    } else {
      const age = y - st.by, loc = st.loc;
      const ghost = p => !p.alive && p.diedYear >= st.by && (p.cause === 'violence' || p.cause === 'travel' || y - p.diedYear <= 3);
      const here = p => p.alive && !p.away && !p.unborn && p.loc === loc && !(p.rel === 'sib' && y - p.by > 25 && age > 18);
      const pick = p => here(p) || ghost(p);
      const rank = { sp: 1, kid: 2, mom: 3, dad: 3, gma: 4, sib: 5 };
      const fam = st.fam.filter(pick).sort((a, b) => rank[a.rel] - rank[b.rel]).slice(0, 7);
      const order = { gma: 0, dad: 1, mom: 2, self: 3, sp: 4, sib: 5, kid: 6 };
      people = fam.map(p => ({ kind: kindOf(p, y), gone: !p.alive, o: order[p.rel], by: p.by }))
        .concat([{ kind: kindOf(st, y), self: true, gone: !st.alive, o: 3, by: st.by }])
        .sort((a, b) => a.o - b.o || a.by - b.by);
    }
    return { seed: st.seed + ':' + (setting === 'city' || setting === 'abroad' ? setting : st.loc), setting, time, weather, war,
      house: st.house.destroyed ? 'destroyed' : st.house.damaged ? 'damaged' : 'ok', roof: FLAT.has(st.iso) ? 'flat' : 'pitched', people };
  }
  const Stage = { a: null, b: null, active: 'a', stops: {}, sig: '' };
  function stageReset() {
    Object.keys(Stage.stops).forEach(k => Stage.stops[k] && Stage.stops[k]());
    Stage.stops = {}; Stage.sig = ''; Stage.active = 'a';
    $('cvA').classList.remove('off'); $('cvB').classList.add('off');
  }
  function stageSet(sc) {
    const k = [sc.seed, sc.setting, sc.time, sc.weather, sc.war, sc.house, sc.people.map(p => p.kind + (p.self ? '*' : '') + (p.gone ? 'g' : '')).join(',')].join('|');
    if (k === Stage.sig) return;
    Stage.sig = k;
    const nextId = Stage.active === 'a' ? 'b' : 'a', oldId = Stage.active;
    const nc = $(nextId === 'a' ? 'cvA' : 'cvB'), oc = $(oldId === 'a' ? 'cvA' : 'cvB');
    if (Stage.stops[nextId]) Stage.stops[nextId]();
    Stage.stops[nextId] = Scene.start(nc, () => sc);
    nc.classList.remove('off'); oc.classList.add('off');
    Stage.active = nextId;
    setTimeout(() => { if (Stage.active !== oldId && Stage.stops[oldId]) { Stage.stops[oldId](); Stage.stops[oldId] = null; } }, 1200);
  }
  // 关键时刻：镜头推近、字幕、闪光
  function moment(text, flash) {
    const stg = $('stage'), cap = $('caption');
    stg.classList.add('zoom');
    if (text) { cap.textContent = text; cap.classList.add('on'); }
    if (flash) { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
    clearTimeout(moment.h);
    const hold = momentHold();
    moment.h = setTimeout(() => { stg.classList.remove('zoom'); cap.classList.remove('on'); }, hold);
  }
  function momentHold() { return Math.max(1400, 2800 / (G ? G.speed : 1)); }
  function momentOf(st, y) {
    const evs = st.log.filter(e => e.y === y), has = t => evs.find(e => e.t === t);
    if (has('death')) return { text: '你死于' + (y - st.by) + '岁。' };
    if (has('house')) return { text: has('house').destroyed ? '房子没了。' : '房子被打中了。', flash: true };
    const ws = has('warStart') || has('warAgain');
    if (ws && ws.zone === 'in' && !ws.away) return { text: '战争来了。', flash: true };
    if (has('armyStart')) return { text: '你穿上了军装。' };
    const mv = has('move');
    if (mv && (mv.loc === 'abroad' || mv.loc === 'city') && !mv.quiet) return { text: mv.loc === 'abroad' ? '越过边境。' : '离开家。' };
    if (has('warEnd') && !has('warEnd').away) return { text: '枪声停了。' };
    const fd = evs.find(e => e.t === 'famDeath' && (e.cause === 'violence' || e.cause === 'travel'));
    if (fd) return { text: '' };
    return null;
  }
  let introStop = null, birthStop = null;
  introStop = Scene.start($('introCv'), () => ({ seed: 'intro', setting: 'village', time: 'dusk', war: 0, roof: 'flat', house: 'ok', people: [{ kind: 'child', self: true }] }));

  // ---------------- 屏幕 ----------------
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  }
  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), ms || 2200);
  }

  // ---------------- 开局 ----------------
  function randomSeed() { return Math.random().toString(36).slice(2, 9); }
  function begin(seed, by, playerBy) {
    const st = E.newLife(seed, by);
    G = { st, seed, playerBy: playerBy || null, runner: Runner.create(st), speed: 1, ended: false, finalShown: false, lastStats: Object.assign({}, st.stats) };
    G.meta = G.runner.meta;
    const b = T.birthText(st);
    $('bcYear').textContent = b.year + ' 年 · ' + b.sex;
    $('bcName').textContent = b.name;
    $('bcPlace').textContent = b.country + ' · ' + b.region;
    $('bcHome').textContent = b.home;
    $('bcFam').textContent = b.family ? '家里有：' + b.family : '';
    renderStats($('bcStats'), st.stats);
    if (introStop) { introStop(); introStop = null; }
    if (birthStop) birthStop();
    const bs = Object.assign(sceneOf(st, st.by), { time: 'day' });
    birthStop = Scene.start($('birthCv'), () => bs);
    show('birth');
  }
  $('btnBorn').onclick = () => {
    const v = parseInt($('byInput').value, 10);
    if (!(v >= 1950 && v <= 2025)) { toast('请输入 1950 到 2025 之间的年份'); return; }
    begin(randomSeed(), v, v);
  };
  $('byInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnBorn').click(); });
  $('btnSkip').onclick = () => begin(randomSeed(), null, null);
  $('btnStart').onclick = () => {
    $('feed').innerHTML = ''; $('grid').innerHTML = '';
    if (birthStop) { birthStop(); birthStop = null; }
    show('life'); stageReset(); nextChapter();
  };

  // ---------------- HUD ----------------
  function renderStats(box, s, prev) {
    box.innerHTML = '';
    ['health', 'money', 'mood', 'social'].forEach(k => {
      const d = el('div', 'stat');
      d.innerHTML = T.STAT_NAME[k] + '<div class="bar"><i style="width:' + s[k] + '%"></i></div>';
      if (prev && s[k] - prev[k] >= 5) d.classList.add('flash-up');
      if (prev && prev[k] - s[k] >= 5) d.classList.add('flash-down');
      box.appendChild(d);
    });
  }
  function famLabel(st, p) {
    const rel = T.relLabel(st, p);
    if (p.rel === 'sib' || p.rel === 'sp' || p.rel === 'kid') return rel + T.personName(st, p.id, p.sex);
    return rel;
  }
  function renderHud(yy) {
    const st = G.st, y = yy != null ? yy : Math.min(st.year, st.deathYear || st.year), age = y - st.by;
    $('hudYear').textContent = y + ' 年 · ' + G.st.c.name;
    $('hudAge').textContent = G.playerBy ? '你们都 ' + age + ' 岁' : age + ' 岁';
    const fb = $('famBar'); fb.innerHTML = '';
    const others = st.fam.filter(p => p.rel === 'sib' && p.id !== 'sis' && p.alive && !p.unborn).length;
    st.fam.forEach(p => {
      if (p.unborn || (!p.alive && !p.diedYear)) return;
      if (p.rel === 'sib' && p.id !== 'sis') return;           // 其他兄弟姐妹合并成一项
      if (!p.alive && p.diedYear < st.by) return;
      const c = el('span', 'fam' + (!p.alive ? ' gone' : p.away ? ' away' : ''));
      c.textContent = p.alive ? famLabel(st, p) + (p.away === 'army' ? '·在部队' : p.away === 'abroad' ? '·在国外' : p.away === 'married' ? '·已出嫁' : '') : famLabel(st, p);
      fb.appendChild(c);
    });
    if (others) fb.appendChild(el('span', 'fam', '兄弟姐妹 ×' + others));
    const f = st.friend;
    if (f && f.met) {
      const c = el('span', 'fam friend' + (!f.alive ? ' gone' : (f.abroad || (f.army && !f.army.done)) ? ' away' : ''));
      c.textContent = '朋友' + Story.friendName(st) + (f.alive && f.army && !f.army.done ? '·在部队' : f.alive && f.abroad ? '·在国外' : '');
      fb.appendChild(c);
    }
    renderStats($('statBar'), st.stats, G.lastStats);
    G.lastStats = Object.assign({}, st.stats);
    $('pocketView').textContent = st.pocket.length ? '口袋：' + st.pocket.map(i => T.itemLabel(st, i)).join('、') : '';
  }

  // ---------------- 章节 ----------------
  const MOMENT = { war: 1, house: 1, loss: 1, friendLoss: 1, leave: 1, army: 1, warEnd: 1 };
  function nextChapter() {
    const ch = G.runner.next();
    syncGrid();
    if (!ch) return finish();
    showChapter(ch);
  }
  function syncGrid() {
    const g = $('grid');
    while (g.children.length < G.runner.meta.length) addSquare(G.runner.meta[g.children.length].cls);
  }
  function addSquare(cls) { $('grid').appendChild(el('i', 'sq' + (cls ? ' ' + cls : ''))); }
  function chapterScene(ch) {
    const st = G.st, y = st.deathYear ? Math.min(ch.y, st.deathYear) : ch.y;
    const sc = sceneOf(st, y, ch.key === 'final');
    if (ch.scene && ch.scene.time) sc.time = ch.scene.time;
    if (ch.scene && ch.scene.weather) sc.weather = ch.scene.weather;
    return sc;
  }
  function showChapter(ch) {
    const feed = $('feed'), btn = $('btnNext');
    btn.classList.add('hidden'); clearTimeout(G.nextT);
    feed.querySelectorAll('.chap').forEach(c => c.classList.add('past'));
    if (ch.bridge) feed.appendChild(el('div', 'bridge', '<span>' + esc(ch.bridge.span) + '</span>' + esc(ch.bridge.text)));
    const box = el('section', 'chap' + (ch.key === 'recap' ? ' recap' : ''));
    let n = 0;
    const line = (txt, cls) => { const p = el('p', 'line' + (cls ? ' ' + cls : ''), esc(txt)); p.style.animationDelay = (0.3 + n++ * 0.6) + 's'; box.appendChild(p); return p; };
    if (ch.key === 'recap') {
      box.appendChild(el('div', 'chead', '回看'));
      line(ch.recap.head); line(ch.recap.mine);
      line('这一次，如果你……', 'muted');
      ch.recap.alts.forEach(a => { const p = line('', 'alt'); p.innerHTML = '<b>' + esc(a.label) + '</b>：' + esc(a.text); });
    } else {
      box.appendChild(el('div', 'chead', (ch.n ? '第 ' + ch.n + ' 章 · ' : '') + esc(ch.title) + '<span>' + ch.y + ' · ' + ch.age + ' 岁</span>'));
      ch.lines.forEach(l => line(l.t));
      if (ch.letter) {
        const lt = el('div', 'letter'); lt.style.animationDelay = (0.3 + n++ * 0.6) + 's';
        lt.innerHTML = '<p>' + esc(ch.letter.to) + '</p>' + ch.letter.body.map(b => '<p>' + esc(b) + '</p>').join('') + '<p class="from">' + esc(ch.letter.from) + '</p>';
        box.appendChild(lt); n += 2;
      }
    }
    feed.appendChild(box);
    setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    renderHud(ch.y);
    if (ch.key !== 'recap') stageSet(chapterScene(ch));
    if (MOMENT[ch.key]) moment(ch.title, ch.key === 'house' || ch.key === 'war');
    const wait = Math.min(0.3 + n * 0.6, 4) * 1000;
    if (ch.key === 'final') G.finalShown = true;
    if (ch.options) {
      const opts = el('div', 'opts'); opts.style.animationDelay = (wait / 1000) + 's';
      ch.options.forEach(o => {
        const b = el('button', 'opt', esc(o.label) + (o.hint ? '<span class="h">' + esc(o.hint) + '</span>' : ''));
        b.onclick = () => choose(ch, o, b, opts, box);
        opts.appendChild(b);
      });
      box.appendChild(opts);
    } else {
      G.nextT = setTimeout(() => { btn.textContent = ch.key === 'final' ? '回看这一生' : '继续'; btn.classList.remove('hidden'); }, wait);
    }
  }
  function choose(ch, o, b, opts, box) {
    opts.querySelectorAll('button').forEach(x => { x.disabled = true; x.classList.add(x === b ? 'picked' : 'dim'); });
    const res = G.runner.answer(ch, o.id);
    if (res) { const p = el('p', 'line result', esc(res)); p.style.animationDelay = '0.1s'; box.appendChild(p); }
    renderHud(G.st.year);
    G.nextT = setTimeout(() => { $('btnNext').textContent = '继续'; $('btnNext').classList.remove('hidden'); }, 500);
  }
  $('btnNext').onclick = () => {
    $('btnNext').classList.add('hidden');
    if (!G || G.ended) return;
    if (G.finalShown) return finish();
    nextChapter();
  };

  // ---------------- 结局 ----------------

    if (G.ended) return;

      G.en = E.ending(st);

  function lastScene() {

  }

  // ---------------- 纪念馆 ----------------
  function saveMemorial() {

  function aboutHtml() {

      '<li>直接暴力风险 = 全国人均冲突死亡 × 距离系数（战区内 3、邻近 0.5、远方 0.05、国外 0.01）× 年龄性别系数；前线士兵 × 6，后方 × 2；单年上限 30%。</li>' +
      '<li>背景死亡用该国当年的预期寿命和 5 岁以下死亡率拟合生命表，再扣掉全国冲突死亡，避免重复计算；健康属性会让它在 0.7–1.5 倍之间浮动。</li>' +
      '<li>和平基线：冲突爆发前最后一个和平年份的指标，按和平国家的平均进步速度外推，且不低于实际值。</li>' +
