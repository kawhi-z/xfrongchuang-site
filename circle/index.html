<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>画一个完美的圆</title>
<meta name="description" content="你能徒手画出一个完美的圆吗？画一笔就知道，还能挑战好友。">
<meta property="og:title" content="画一个完美的圆 · 你能画多圆？">
<meta property="og:description" content="你能徒手画出一个完美的圆吗？画一笔就知道，还能挑战好友。">
<meta property="og:image" content="https://xfrongchuang.com/circle/og.png">
<meta property="og:url" content="https://xfrongchuang.com/circle/">
<style>
:root{
  --bg:#0d0f14; --fg:#f2efe8; --dim:rgba(242,239,232,.55);
  --u:min(1vw,1vh); /* 舞台单位：舞台边长 = 100u */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
main{position:fixed;inset:0;
  background:radial-gradient(circle at 50% 50%,#1b2030 0,#0d0f14 70%);transition:background .6s}
main::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:calc(var(--u)*5) calc(var(--u)*5);background-position:center}
main.divine{background:#05060a}
main.divine::before{opacity:1;background-size:600px 600px;background-position:0 0;animation:drift 30s linear infinite;
  background-image:
   radial-gradient(1.5px 1.5px at 40px 60px,#fff,transparent),radial-gradient(1px 1px at 120px 220px,#cde,transparent),
   radial-gradient(2px 2px at 300px 90px,#fff,transparent),radial-gradient(1px 1px at 450px 400px,#fed,transparent),
   radial-gradient(1.5px 1.5px at 520px 160px,#fff,transparent),radial-gradient(1px 1px at 210px 480px,#fff,transparent),
   radial-gradient(1px 1px at 360px 300px,#acf,transparent),radial-gradient(2px 2px at 80px 380px,#fff,transparent),
   radial-gradient(1px 1px at 580px 540px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 560px,#ffd,transparent)}
@keyframes drift{to{background-position:600px 0}}

/* 得分特效 */
.rays{position:fixed;left:50%;top:50%;width:max(150vw,150vh);aspect-ratio:1;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(rgba(255,240,200,.9) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);
  transform:translate(-50%,-50%) scale(0);transition:opacity 1s,transform 1s}
.rays.on{opacity:.12;transform:translate(-50%,-50%) scale(1);animation:spin 20s linear infinite}
.rays.fast{animation-duration:10s}
.glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;
  background:radial-gradient(circle,rgba(255,255,255,.35) 0,transparent 55%)}
.glow.on{opacity:.6}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(1turn)}}

/* 舞台：1000×1000 逻辑坐标 */
#stage{position:absolute;left:50%;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*100);
  transform:translate(-50%,-50%);touch-action:none}
#stage svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke-linecap:round;overflow:visible}
#stage svg.spin{animation:spinSvg 10s linear infinite}
@keyframes spinSvg{to{transform:rotate(1turn)}}
#pad{position:absolute;inset:0;cursor:crosshair;z-index:3}
#stage.best svg{filter:drop-shadow(0 0 calc(var(--u)*1.5) var(--score-color))}

.dot{position:absolute;left:50%;top:50%;width:calc(var(--u)*2);height:calc(var(--u)*2);margin:calc(var(--u)*-1) 0 0 calc(var(--u)*-1);
  border-radius:50%;background:var(--fg);box-shadow:0 0 calc(var(--u)*1.5) rgba(255,255,255,.35);z-index:2;pointer-events:none}

.txt{position:absolute;left:0;right:0;text-align:center;pointer-events:none;z-index:2;
  text-shadow:0 2px 0 var(--bg),0 0 8px var(--bg)}
#score{bottom:calc(50% + var(--u)*3);font:700 calc(var(--u)*11)/1 "SF Mono",Menlo,Consolas,"Courier New",monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;opacity:0;transition:opacity .3s}
#score small{font-size:.6em;margin-left:.08em}
#score.on{opacity:1}
#msg{top:calc(50% + var(--u)*4);font-size:calc(var(--u)*3.8);font-weight:600;min-height:1.2em}
#msg b{font:700 1.15em "SF Mono",Menlo,monospace;margin-left:.3em}
#msg.blink{animation:blink .6s steps(2,start) 3}
@keyframes blink{to{visibility:hidden}}
#hint{top:calc(50% - var(--u)*12);font-size:calc(var(--u)*3.6);color:var(--dim);line-height:1.5;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}

/* 开始界面 */
#intro{position:absolute;left:50%;bottom:calc(50% + var(--u)*4);transform:translate(-50%,0);text-align:center;z-index:4;
  transition:opacity .6s,transform .6s;pointer-events:none}
#intro.off{opacity:0;transform:translate(-50%,calc(var(--u)*-3))}
#intro p{font-size:calc(var(--u)*3.4);color:var(--dim);letter-spacing:.2em}
#intro h1{font-size:calc(var(--u)*7.5);font-weight:800;letter-spacing:.06em;margin-top:calc(var(--u)*.8)}
#intro h1 em{font-style:normal;background:linear-gradient(90deg,#ff5a4e,#ffc93c,#3ee07a);-webkit-background-clip:text;background-clip:text;color:transparent}
#go{position:absolute;left:50%;top:50%;width:calc(var(--u)*13);height:calc(var(--u)*13);margin:calc(var(--u)*-6.5) 0 0 calc(var(--u)*-6.5);
  border:none;border-radius:50%;background:var(--fg);color:var(--bg);font-size:calc(var(--u)*4);font-weight:800;letter-spacing:.1em;
  cursor:pointer;z-index:5;transition:transform .5s,opacity .5s;box-shadow:0 0 0 calc(var(--u)*1) rgba(242,239,232,.12)}
#go:hover{transform:scale(1.06)}
#go.off{transform:scale(.15);opacity:0;pointer-events:none}

/* 顶栏 & 分享 */
.top{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:6;font-size:14px;color:var(--dim)}
.top button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:6px 8px;border-radius:8px}
.top button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.share{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:10px;z-index:6}
.share.on{display:flex;animation:up .4s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}}
.share button{border:none;border-radius:12px;padding:11px 18px;font:600 15px/1 inherit;font-family:inherit;color:#fff;cursor:pointer;transition:transform .2s}
.share button:hover{transform:scale(1.06)}
#btnSave{background:#e8453c}#btnShare{background:#4f6df5}
#btnAgain{background:rgba(255,255,255,.14)}

/* 挑战模式 */
#intro.ch{bottom:calc(50% + var(--u)*9)}
#intro .vs{font-size:calc(var(--u)*3.2);color:var(--dim);margin-top:calc(var(--u)*1.2);letter-spacing:.1em}
#vs{top:calc(50% + var(--u)*10);font-size:calc(var(--u)*3.2);font-weight:600;color:var(--dim)}
#vs.win{color:#4be08a}#vs.lose{color:#ff8a80}

/* 分享弹层 */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(380px,100%);max-height:100%;overflow:auto;background:#171a22;border-radius:18px;padding:18px 16px 16px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-user-select:auto;user-select:auto}
.sheet img{display:block;width:100%;border-radius:12px;background:#0d0f14;-webkit-touch-callout:default;aspect-ratio:1080/1350}
.sheet .tip{font-size:13px;color:var(--dim);margin:10px 0 12px;line-height:1.5}
.sheet .tip b{color:var(--fg)}
.sheet input{width:100%;background:#0d0f14;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:var(--fg);padding:10px 12px;font:15px inherit;font-family:inherit;outline:none;margin-bottom:12px}
.sheet input:focus{border-color:#4f6df5}
.sheet .row{display:flex;gap:8px}
.sheet .row button{flex:1;border:none;border-radius:10px;padding:12px 6px;font:600 14px/1 inherit;font-family:inherit;color:#fff;cursor:pointer;background:#2a2f3c}
.sheet .row button.primary{background:#4f6df5}
.sheet .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--dim);font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
.wx-arrow{position:fixed;top:6px;right:14px;z-index:21;color:#fff;font-size:15px;text-align:right;line-height:1.6;display:none;pointer-events:none}
.wx-arrow.on{display:block}
.wx-arrow b{font-size:30px;display:block}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<img src="og.png" alt="" style="position:absolute;width:0;height:0;opacity:0">
<main id="main">
  <div class="rays" id="rays"></div>
  <div class="glow" id="glow"></div>
  <div class="top">
    <span>⭕ 画圆挑战</span>
    <span><button id="btnSound">🔊 音效</button></span>
  </div>

  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 1000"></svg>
    <div class="dot"></div>
    <div class="txt" id="score"></div>
    <div class="txt" id="hint">绕着这个点<br>画一个圆</div>
    <div class="txt" id="msg"></div>
    <div class="txt" id="vs"></div>
    <div id="intro"><p>你能画出一个</p><h1><em>完美</em>的圆吗？</h1></div>
    <button id="go">开始</button>
    <div id="pad"></div>
  </div>

  <div class="share" id="share">
    <button id="btnShare">📤 分享成绩 · 挑战好友</button>
  </div>
  <div class="toast" id="toast"></div>
</main>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="x" id="mClose" aria-label="关闭">×</button>
    <img id="card" alt="成绩卡">
    <p class="tip" id="mTip"></p>
    <input id="nick" maxlength="8" placeholder="你的昵称（选填，好友会看到）" autocomplete="off">
    <div class="row">
      <button id="mCopy" class="primary">复制挑战链接</button>
      <button id="mSys">更多分享</button>
      <button id="mSave">下载图片</button>
    </div>
  </div>
</div>
<div class="wx-arrow" id="wxArrow"><b>↗</b>点右上角 ··· <br>发送给朋友 / 朋友圈</div>

<script>
(() => {
'use strict';
// ===== 常量（与原版一致）=====
const C = { x: 500, y: 500 };          // 圆心（逻辑坐标）
const MIN_START_R = 100;               // 起笔离圆心最小距离
const MIN_R = 30;                      // 画的过程中离圆心最小距离
const MIN_STEP = 6;                    // 小于该位移的移动忽略
const TIMEOUT = 7000;                  // 超时
const FINISH_DEG = 335;                // 松手时超过该角度也算完成
const BEST_KEY = 'pc.best';
const NICK_KEY = 'pc.nick';
const SITE = 'https://xfrongchuang.com/circle/';   // 本地 file:// 打开时用于生成链接

const $ = id => document.getElementById(id);
const fmt = s => (s / 10).toFixed(1);
const isWx = /MicroMessenger/i.test(navigator.userAgent);

// ===== 挑战参数 ?s=973&n=昵称 =====
let challenge = (() => {
  const q = new URLSearchParams(location.search);
  const s = parseInt(q.get('s'), 10);
  if (!(s >= 1 && s <= 999)) return null;
  const n = (q.get('n') || '').trim().slice(0, 8);
  return { score: s, name: n };
})();
const baseUrl = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : SITE;
function shareUrl(score, nick) {
  return `${baseUrl}?s=${score}` + (nick ? `&n=${encodeURIComponent(nick)}` : '');
}
let nick = '';
try { nick = localStorage.getItem(NICK_KEY) || ''; } catch (e) {}
const svg = $('svg'), pad = $('pad'), stage = $('stage'), main = $('main');
const elScore = $('score'), elMsg = $('msg'), elHint = $('hint');

// 0~1 精度 -> 颜色：红(0.75以下) → 黄 → 绿(1.0)
function color(t) {
  const h = Math.max(0, Math.min(480 * (t - 0.75), 120));
  return `hsl(${h},100%,${40 + 0.2 * h}%)`;
}
const angleOf = p => 180 + 180 * Math.atan2(p.y - C.y, p.x - C.x) / Math.PI;
const distOf = p => Math.hypot(p.x - C.x, p.y - C.y);

// ===== 状态 =====
const S = {
  started: false, drawing: false, hasDrawn: false, valid: false,
  score: 0, best: 0, newBest: false,
  sound: true,
};
try { S.best = parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}
let last = {};        // 上一个采样点
let r0 = 0;           // 起笔半径（基准）
let dir = 0;          // 方向 ±1，0=未定
let sumW = 0;         // 累计加权角度 Σ|Δθ|·k
let sumD = 0;         // 累计角度 Σ|Δθ|（封顶 360）
let timer = null;
let segs = [];        // 用于导出分享图 {d,color,width}

// ===== 音效（WebAudio 合成，无外部资源）=====
let ac = null, drawOsc = null, drawGain = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, t0, dur, type = 'sine', vol = .2) {
  const a = audio(); if (!a || !S.sound) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05);
}
const sfx = {
  error() { tone(180, 0, .25, 'square', .08); tone(120, .1, .3, 'square', .08); },
  best() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .35, 'triangle', .15)); },
  ahh() { [392, 494, 587, 784].forEach(f => tone(f, 0, 2.2, 'sine', .07)); },
  drawStart() {
    const a = audio(); if (!a) return;
    drawOsc = a.createOscillator(); drawGain = a.createGain();
    drawOsc.type = 'sawtooth'; drawOsc.frequency.value = 90;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    drawGain.gain.value = 0;
    drawOsc.connect(lp).connect(drawGain).connect(a.destination); drawOsc.start();
  },
  drawVol(v, pitch) {
    if (!drawGain) return;
    const t = ac.currentTime;
    drawGain.gain.setTargetAtTime(S.sound ? v : 0, t, .03);
    if (pitch) drawOsc.frequency.setTargetAtTime(pitch, t, .05);
  },
  drawStop() { if (drawOsc) { try { drawOsc.stop(); } catch (e) {} drawOsc = drawGain = null; } },
};

// ===== 渲染 =====
function drawPath(d, col, w) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  p.setAttribute('style', `stroke:${col};stroke-width:${w}px`);
  svg.appendChild(p);
}
function scoreText() {
  if (S.score === 0) return 'XX.X';
  return (S.score / 10).toFixed(1);
}
function render() {
  const col = S.scoreCol || color(0);
  elScore.innerHTML = `${scoreText()}<small>%</small>`;
  elScore.style.color = col;
  elScore.classList.toggle('on', S.hasDrawn);
  stage.style.setProperty('--score-color', col);
  stage.classList.toggle('best', S.newBest);
  elHint.classList.toggle('on', S.started && !S.hasDrawn);
  const ok = S.valid && !S.drawing;
  main.classList.toggle('divine', ok && S.score >= 990);
  $('rays').classList.toggle('on', ok && S.score >= 950);
  $('rays').classList.toggle('fast', ok && S.score >= 970);
  $('glow').classList.toggle('on', ok && S.score >= 960);
  svg.classList.toggle('spin', ok && S.score >= 970);
  $('share').classList.toggle('on', ok);
  // 挑战胜负
  const vs = $('vs');
  vs.className = 'txt';
  vs.textContent = '';
  if (challenge && ok) {
    const who = challenge.name || 'TA', diff = S.score - challenge.score;
    if (diff > 0) { vs.textContent = `🏆 你赢了 ${who}！高出 ${fmt(diff)}%`; vs.classList.add('win'); }
    else if (diff === 0) vs.textContent = `🤝 和 ${who} 打平了！`;
    else { vs.textContent = `还差 ${fmt(-diff)}% 才能赢 ${who}（${fmt(challenge.score)}%）`; vs.classList.add('lose'); }
  }
}
function setMsg(text, blink) {
  elMsg.textContent = text;
  elMsg.classList.remove('blink');
  if (blink) { void elMsg.offsetWidth; elMsg.classList.add('blink'); }
}
function showBest() {
  elMsg.classList.remove('blink');
  elMsg.innerHTML = `最佳：<b style="color:${color(S.best)}">${(Math.min(Math.round(S.best * 1000), 999) / 10).toFixed(1)}%</b>`;
}

// ===== 坐标 =====
function coords(e) {
  const r = svg.getBoundingClientRect(), k = 1000 / r.width;
  return { x: k * (e.clientX - r.left), y: k * (e.clientY - r.top) };
}

// ===== 绘制逻辑（复刻原版评分）=====
function onStart(e) {
  if (S.drawing || !S.started) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  stopDemo();
  S.hasDrawn = true; S.newBest = false; S.drawing = true; S.valid = false;
  S.score = 0; S.scoreCol = color(0);
  const p = coords(e);
  last = { x: p.x, y: p.y, time: performance.now(), speed: 0, dx: 0, dy: 0,
    angle: angleOf(p), radius: distOf(p), distance: 0, stroke: 20 };
  r0 = last.radius; dir = 0; sumW = 0; sumD = 0; segs = [];
  svg.replaceChildren();
  setMsg('');
  clearTimeout(timer);
  timer = setTimeout(() => fail('太慢了'), TIMEOUT);
  sfx.drawStart();
  if (r0 < MIN_START_R) return fail('离圆点太近了');
  render();
}

function onMove(e) {
  if (!S.drawing) return;
  e.preventDefault();
  const now = performance.now(), p = coords(e);
  const dx = p.x - last.x, dy = p.y - last.y, h = Math.hypot(dx, dy);
  if (h < MIN_STEP) { sfx.drawVol(0); return; }
  const speed = h / (0.001 + now - last.time);
  if (last.distance === 0) last.distance = h;
  if (last.speed === 0) last.speed = speed;

  // 笔画宽度：越快越细，平滑
  let w = 1.5 + 2 / (0.05 + speed);
  w = Math.min((3 * last.stroke + w) / 4, 20);

  const ang = angleOf(p);
  let da = ang - last.angle;
  if (da < -180) da += 360; else if (da > 180) da -= 360;
  const sgn = da < 0 ? -1 : 1;
  if (dir === 0) { if (Math.abs(da) < 0.1) return; dir = sgn; }

  const rad = distOf(p);
  const k = Math.max(0, 1 - Math.abs((rad + last.radius) / 2 - r0) / r0);

  // 三次贝塞尔平滑连接
  const cx = last.dx * h / last.distance, cy = last.dy * h / last.distance;
  const mx = dx + (dx - cx), my = dy + (dy - cy);
  const d = `M${last.x} ${last.y} C${last.x + cx / 3.5} ${last.y + cy / 3.5},${p.x - mx / 3.5} ${p.y - my / 3.5},${p.x} ${p.y}`;
  const col = color(k);
  drawPath(d, col, w); segs.push({ d, col, w });
  sfx.drawVol(Math.min(k * speed / 75, 0.15), 80 + 120 * k);

  if (sgn !== dir) return fail('方向反了');
  if (rad < MIN_R) return fail('离圆点太近了');

  last = { x: p.x, y: p.y, time: now, speed, dx, dy, angle: ang, radius: rad, distance: h, stroke: w };
  let a = Math.abs(da);
  sumD += a;
  if (sumD > 360) { a -= sumD - 360; sumD = 360; }
  sumW += a * k;
  S.score = Math.min(Math.round(1000 * sumW / sumD), 999);
  S.scoreCol = color(sumW / sumD);
  render();
  if (sumD === 360) complete();
}

function onEnd() {
  if (!S.drawing) return;
  if (sumD > FINISH_DEG) complete();
  else fail('请画一个完整的圆');
}

function fail(text) {
  S.drawing = false; S.valid = false;
  clearTimeout(timer);
  sfx.drawStop(); sfx.error();
  S.score = 0; S.scoreCol = color(0);
  setMsg(text, true);
  render();
}

function complete() {
  S.drawing = false; S.valid = true;
  clearTimeout(timer);
  sfx.drawStop();
  if (S.score > Math.round(1000 * S.best)) {
    S.best = sumW / sumD;
    try { localStorage.setItem(BEST_KEY, String(S.best)); } catch (e) {}
    if (S.score >= 950) sfx.ahh();
    sfx.best();
    S.newBest = true;
    setMsg(S.score === 999 ? '完美之圆！' : S.score >= 990 ? '神级之圆！' : S.score >= 980 ? '传奇之圆！' : '新纪录！', true);
  } else {
    showBest();
  }
  render();
  updateShareTarget();
}

// 地址栏/标题同步成"我的挑战"，这样微信右上角 ··· 直接转发出去的就是带分数的链接
function updateShareTarget() {
  if (!S.valid) return;
  const url = shareUrl(S.score, nick);
  document.title = `我画的圆有 ${fmt(S.score)}% 圆，你能画得比我圆吗？`;
  if (/^https?:$/.test(location.protocol)) {
    try { history.replaceState(null, '', url); sessionStorage.setItem('pc.own', location.search); } catch (e) {}
  }
}

pad.addEventListener('pointerdown', onStart);
pad.addEventListener('pointermove', onMove);
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => pad.addEventListener(t, onEnd));

// ===== 开场演示动画（原版公式：抖动的圆）=====
const demo = { count: 2000, angle: -2.5, lastX: 0, lastY: 0, stroke: 20, r0: 0, raf: 0 };
function demoAnim() {
  if (S.hasDrawn || --demo.count < 491) return;
  const t = 0.04 + 0.01 * Math.cos(2 + demo.count / 47);
  demo.angle += t;
  const R = 280 + 85 * Math.sin(4 + demo.count / 66);
  const x = C.x + R * Math.cos(demo.angle) + 50 * Math.sin(1 + demo.count / 29);
  const y = C.y + R * Math.sin(demo.angle) + 50 * Math.cos(5 + demo.count / 17);
  const r = Math.hypot(x - C.x, y - C.y);
  if (!demo.r0) demo.r0 = r;
  const k = 1 - Math.abs(r - demo.r0) / demo.r0;
  if (!demo.lastX) { demo.lastX = x; demo.lastY = y; }
  drawPath(`M${demo.lastX} ${demo.lastY} L${x} ${y}`, color(k), demo.stroke);
  demo.lastX = x; demo.lastY = y;
  demo.stroke = (9 * demo.stroke + (16 - 300 * t)) / 10;
  demo.raf = requestAnimationFrame(demoAnim);
}
function stopDemo() { cancelAnimationFrame(demo.raf); demo.count = 0; }
demo.raf = requestAnimationFrame(demoAnim);

$('go').addEventListener('click', () => {
  S.started = true;
  audio();
  $('go').classList.add('off'); $('intro').classList.add('off');
  setTimeout(() => { if (!S.hasDrawn) { stopDemo(); svg.replaceChildren(); } render(); }, 500);
  render();
});

// ===== 音效开关 =====
$('btnSound').addEventListener('click', () => {
  S.sound = !S.sound;
  $('btnSound').textContent = S.sound ? '🔊 音效' : '🔇 静音';
  if (!S.sound) sfx.drawVol(0);
});

// ===== 分享卡片（1080×1350：上方 1080 方形画圆，下方 270 文案+二维码）=====
const FONT = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
function makeCanvas() {
  const N = 1080, H = 1350, cv = document.createElement('canvas');
  cv.width = N; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#0d0f14'; g.fillRect(0, 0, N, H);
  // 背景
  const bg = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N * .7);
  bg.addColorStop(0, S.score >= 990 ? '#10131c' : '#1b2030'); bg.addColorStop(1, '#0d0f14');
  g.fillStyle = bg; g.fillRect(0, 0, N, N);
  if (S.score >= 960) {
    const gl = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N * .55);
    gl.addColorStop(0, 'rgba(255,255,255,.22)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(0, 0, N, N);
  }
  // 根据圆的外接范围自适应缩放（原版：max(范围+70, 330)）
  const bb = svg.getBBox();
  const ext = Math.max(500 - bb.x, bb.x + bb.width - 500, 500 - bb.y, bb.y + bb.height - 500);
  const half = Math.max(ext + 70, 330), s = N / (2 * half);
  g.save();
  g.setTransform(s, 0, 0, s, N / 2 - 500 * s, N / 2 - 500 * s);
  g.lineCap = 'round';
  if (S.newBest) { g.shadowColor = S.scoreCol; g.shadowBlur = 18; }
  for (const sg of segs) { g.strokeStyle = sg.col; g.lineWidth = sg.w; g.stroke(new Path2D(sg.d)); }
  g.shadowBlur = 0;
  g.fillStyle = '#f2efe8'; g.beginPath(); g.arc(500, 500, 9, 0, Math.PI * 2); g.fill();
  g.textAlign = 'center';
  g.shadowColor = '#0d0f14'; g.shadowOffsetX = 2; g.shadowOffsetY = 3;
  g.fillStyle = S.scoreCol;
  g.font = '700 100px "SF Mono",Menlo,Consolas,monospace';
  g.fillText(scoreText() + '%', 500, 470);
  const tag = S.newBest ? elMsg.textContent : (challenge ? $('vs').textContent : '');
  if (tag) {
    g.fillStyle = '#f2efe8';
    g.font = `600 36px ${FONT}`;
    g.fillText(tag, 500, 580);
  }
  g.restore();

  // 底栏：文案 + 二维码
  const y0 = N;
  g.fillStyle = '#161922'; g.fillRect(0, y0, N, H - y0);
  g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, y0, N, 2);
  const L = 64;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = 'rgba(242,239,232,.6)'; g.font = `500 30px ${FONT}`;
  g.fillText(nick ? `${nick} 画的圆有` : '我画的圆有', L, y0 + 78);
  g.fillStyle = S.scoreCol; g.font = '800 76px "SF Mono",Menlo,Consolas,monospace';
  const sc = fmt(S.score) + '%';
  g.fillText(sc, L, y0 + 160);
  const sw = g.measureText(sc).width;
  g.fillStyle = '#f2efe8'; g.font = `700 40px ${FONT}`;
  g.fillText(' 圆', L + sw, y0 + 158);
  g.fillStyle = 'rgba(242,239,232,.85)'; g.font = `600 34px ${FONT}`;
  g.fillText('你能画得比我圆吗？扫码挑战 👉', L, y0 + 222);
  // 二维码
  const Q = 200, qx = N - L - Q, qy = y0 + 35;
  g.fillStyle = '#fff'; roundRect(g, qx - 12, qy - 12, Q + 24, Q + 24, 16); g.fill();
  drawQR(g, shareUrl(S.score, nick), qx, qy, Q);
  return cv;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawQR(g, text, x, y, size) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), c = size / n;
  g.fillStyle = '#0d0f14';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++)
    if (qr.isDark(r, k)) g.fillRect(x + k * c, y + r * c, Math.ceil(c), Math.ceil(c));
}
async function makeImage() {
  const blob = await new Promise(r => makeCanvas().toBlob(r, 'image/png'));
  return new File([blob], 'perfect-circle.png', { type: 'image/png' });
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

// 复制：clipboard API 不可用时（微信/非 https）退回 execCommand
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
const shareText = () => `我画的圆有 ${fmt(S.score)}% 圆，你能画得比我圆吗？⭕ ${shareUrl(S.score, nick)}`;

// ===== 分享弹层 =====
const modal = $('modal'), card = $('card'), nickEl = $('nick');
function refreshCard() { card.src = makeCanvas().toDataURL('image/png'); }
function openShare() {
  nickEl.value = nick;
  refreshCard();
  $('mTip').innerHTML = isWx
    ? '<b>长按图片</b>保存或发送给朋友<br>或点右上角 ··· 直接转发挑战链接'
    : '手机上<b>长按图片</b>可保存 / 转发，好友扫码即可挑战你';
  $('mSys').style.display = !isWx && navigator.share ? '' : 'none';
  $('mSave').style.display = isWx ? 'none' : '';
  modal.classList.add('on');
  if (isWx) { $('wxArrow').classList.add('on'); setTimeout(() => $('wxArrow').classList.remove('on'), 4000); }
}
function closeShare() { modal.classList.remove('on'); $('wxArrow').classList.remove('on'); }
$('btnShare').addEventListener('click', openShare);
$('mClose').addEventListener('click', closeShare);
modal.addEventListener('click', e => { if (e.target === modal) closeShare(); });
nickEl.addEventListener('change', () => {
  nick = nickEl.value.trim().slice(0, 8);
  try { localStorage.setItem(NICK_KEY, nick); } catch (e) {}
  refreshCard(); updateShareTarget();
});
$('mCopy').addEventListener('click', async () => {
  toast(await copyText(shareText()) ? '已复制，粘贴发给好友吧' : '复制失败，请长按图片分享');
});
$('mSys').addEventListener('click', async () => {
  try {
    const f = await makeImage(), text = shareText();
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], text });
    else await navigator.share({ text, url: shareUrl(S.score, nick) });
  } catch (e) { if (e.name !== 'AbortError') toast('分享失败'); }
});
$('mSave').addEventListener('click', async () => {
  const f = await makeImage(), url = URL.createObjectURL(f);
  const a = document.createElement('a'); a.href = url; a.download = f.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('图片已保存');
});

// ===== 挑战模式开场 =====
if (challenge && sessionStorage.getItem('pc.own') !== location.search) {
  const who = challenge.name ? escapeHtml(challenge.name) : '你的好友';
  $('intro').innerHTML = `<p>${who} 画出了</p><h1><em>${fmt(challenge.score)}%</em> 的圆</h1><div class="vs">你能画得更圆吗？</div>`;
  $('intro').classList.add('ch');
  $('go').textContent = '应战';
  document.title = `${challenge.name || '好友'}画了 ${fmt(challenge.score)}% 的圆，你能超过吗？`;
} else if (challenge) {
  // 自己刷新了自己的链接，不算挑战
  challenge = null;
  history.replaceState(null, '', location.pathname);
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

render();
// 测试钩子
window.__pc = { S, makeImage, makeCanvas, openShare, get sumD() { return sumD; }, get msg() { return elMsg.textContent; } };
})();
</script>
