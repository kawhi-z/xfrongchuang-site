      '<li>1989 年以前的冲突死亡，是对 33 段主要战争的手工粗略估计，按年均摊；2026 年以后的数据是外推，所以写作「也许」。</li>' +
      '</ul><h3>结尾的数字</h3><ul><li>2024 年全球武装冲突死亡约 ' + Math.round(m.worldConflictDeaths2024 / 10000) + ' 万：UCDP（经 OWID）。</li>' +
      '<li>约 1.2 亿人被迫离开家园：UNHCR《全球趋势》2024。</li><li>约每 6 个孩子有 1 个生活在冲突地区：Save the Children / PRIO 2024。</li></ul>' +
      '<h3>如果你需要帮助</h3><p>游戏里有死亡、暴力和失去。如果这些让你难受，请停下来，和身边信任的人聊聊。</p>';
  }
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    $('overlayBody').innerHTML = b.dataset.open === 'memorial' ? memorialHtml() : aboutHtml();
    $('overlay').classList.remove('hidden');
  });
  $('btnClose').onclick = () => $('overlay').classList.add('hidden');

  // ---------------- 分享 ----------------
  function shareUrl() {
    const base = location.href.split('?')[0].split('#')[0];
    return base + '?s=' + encodeURIComponent(G.seed) + '&y=' + G.st.by;
  }
  $('btnCopy').onclick = () => {
    const u = shareUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(() => toast('已复制。打开链接的人会出生成同一个人。'), () => toast(u, 6000));
    else toast(u, 6000);
  };
  $('btnAgain').onclick = () => {
    history.replaceState(null, '', location.href.split('?')[0]); show('intro');
    if (!introStop) introStop = Scene.start($('introCv'), () => ({ seed: 'intro', setting: 'village', time: 'dusk', war: 0, roof: 'flat', house: 'ok', people: [{ kind: 'child', self: true }] }));
  };
  $('btnSave').onclick = () => {
    const cv = drawCard();
    const done = url => { const a = document.createElement('a'); a.href = url; a.download = '本该有的一生-' + G.et.name + '.png'; document.body.appendChild(a); a.click(); a.remove(); };
    if (cv.toBlob) cv.toBlob(b => { const u = URL.createObjectURL(b); done(u); setTimeout(() => URL.revokeObjectURL(u), 4000); }, 'image/png');
    else done(cv.toDataURL('image/png'));
  };
  function drawCard() {
    const W = 1080, H = 1440, cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    cv.width = W; cv.height = H;
    // 先空跑一遍量正文高度，剩下的空间给画面（320–620 像素）
    const h = layout(ctx, 0, true);
    ctx.fillStyle = '#14110f'; ctx.fillRect(0, 0, W, H);
    const sh = Math.max(320, Math.min(620, H - 120 - h - 10));
    const sc = document.createElement('canvas'); sc.width = W; sc.height = sh;
    Scene.draw(sc.getContext('2d'), W, sh, lastScene(), 4);
    ctx.drawImage(sc, 0, 0);
    layout(ctx, sh - 30, false);
    ctx.fillStyle = '#6c6156'; ctx.font = '24px -apple-system,"PingFang SC",sans-serif'; ctx.textBaseline = 'top';
    ctx.fillText('《本该有的一生》· 人物由统计数据生成，不是真实个人', 90, H - 80);
    return cv;
  }
  function layout(ctx, top, dry) {
    const W = 1080, st = G.st, et = G.et, b = T.birthText(st), P = 90, MW = W - P * 2;
    const serif = '"Songti SC","Noto Serif SC","Source Han Serif SC",serif', sans = '-apple-system,"PingFang SC",sans-serif';
    const text = (s, x, y) => { if (!dry) ctx.fillText(s, x, y); };
    const wr = (s, y, lh) => { let line = '', yy = y; for (const ch of s) { if (ctx.measureText(line + ch).width > MW && line) { text(line, P, yy); yy += lh; line = ch; } else line += ch; } if (line) { text(line, P, yy); yy += lh; } return yy; };
    ctx.textBaseline = 'top';
    let y = top;
    ctx.fillStyle = '#9b8f80'; ctx.font = '28px ' + sans; text(et.title.split('').join(' '), P, y); y += 54;
    ctx.fillStyle = '#ece4d8'; ctx.font = '600 76px ' + serif; text(et.name, P, y); y += 102;
    ctx.fillStyle = '#9b8f80'; ctx.font = '30px ' + sans; text(st.by + '–' + (st.deathYear || st.year) + ' · ' + b.country + ' · ' + b.region, P, y); y += 78;
    ctx.font = '40px ' + serif; ctx.fillStyle = '#ece4d8';
    et.main.forEach(s => { y = wr(s, y, 62); });
    ctx.font = '36px ' + serif; ctx.fillStyle = '#d8ccbb';
    (et.trio || []).forEach(s => { y = wr(s, y + 4, 56); });
    ctx.font = '40px ' + serif;
    y += 10; ctx.fillStyle = '#d9a35b'; y = wr(et.peace, y, 62);
    if (et.hard) { y += 10; ctx.fillStyle = '#e9d2b0'; y = wr(et.hard, y, 62); }
    if (et.took) { y += 6; ctx.fillStyle = '#ece4d8'; ctx.font = '34px ' + serif; y = wr(et.took, y, 54); }
    if (G.words) { y += 10; ctx.fillStyle = '#ffffff'; ctx.font = 'italic 36px ' + serif; y = wr('「' + G.words + '」', y, 56); }
    y += 24;
    const cells = G.meta.map(m => m.cls).concat(new Array(Math.max(0, G.en.peace.age - G.en.age)).fill('lost'));
    const sz = 16, gap = 5, perRow = Math.floor((MW + gap) / (sz + gap));
    const col = { '': '#d6c7ae', war: '#9c4a35', near: '#8a6a3a', abroad: '#5f7385' };
    if (!dry) cells.forEach((c, i) => {
      const cx = P + (i % perRow) * (sz + gap), cy = y + Math.floor(i / perRow) * (sz + gap);
      if (c === 'lost') { ctx.strokeStyle = '#6a5c4f'; ctx.lineWidth = 2; ctx.strokeRect(cx + 1, cy + 1, sz - 2, sz - 2); }
      else { ctx.fillStyle = col[c] || col['']; ctx.fillRect(cx, cy, sz, sz); }
    });
    y += Math.ceil(cells.length / perRow) * (sz + gap) + 16;
    ctx.font = '24px ' + sans; let lx = P;
    [['', '活过的年'], ['war', '战区'], ['near', '战时'], ['abroad', '在异乡'], ['lost', '被夺走的年']].forEach(([c, t]) => {
      if (!dry) {
        if (c === 'lost') { ctx.strokeStyle = '#6a5c4f'; ctx.lineWidth = 2; ctx.strokeRect(lx + 1, y + 5, sz - 2, sz - 2); }
        else { ctx.fillStyle = col[c]; ctx.fillRect(lx, y + 4, sz, sz); }
      }
      ctx.fillStyle = '#6c6156'; text(t, lx + sz + 8, y); lx += sz + 8 + ctx.measureText(t).width + 26;
    });
    y += 70;
    if (et.enemy) { ctx.font = '30px ' + serif; ctx.fillStyle = '#9b8f80'; y = wr(et.enemy, y, 46) + 16; }
    ctx.font = '28px ' + sans; ctx.fillStyle = '#9b8f80'; y = wr(et.number, y, 42);
    return y - top;
  }

  // ---------------- 链接直达 ----------------
  const q = new URLSearchParams(location.search);
  if (q.get('s')) {
    const by = parseInt(q.get('y'), 10);
    begin(q.get('s'), by >= 1950 && by <= 2025 ? by : null, null);
  }
  window.__G = () => G;   // 调试/截图用
})();
</script>
